[project]
name = "philosiphai"
version = "0.2.0"
description = "Knowledge Graph RAG with Community Routing"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "networkx>=3.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "spacy>=3.7.0",
    "tqdm>=4.65.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
philosiphai-ingest = "src.ingest.cli:main"
philosiphai-server = "src.api.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end style tests (e.g. multi-request concurrency). Run with: pytest -m e2e",
    "live_integration: real LLM and DB; set RUN_LIVE_INTEGRATION=1 and have OPENAI_API_KEY, PHILOSOPH_DB. Run: RUN_LIVE_INTEGRATION=1 pytest -m live_integration -v",
    "thread_safety: shared agent state and leakage detection",
    "ordering: request ordering guarantees (placeholder until session/sequence API)",
    "rate_limit: rate limiting correctness (placeholder until implemented)",
    "caching: cache hit/miss behavior",
    "db_contention: DB under load (performance/soak)",
    "performance: latency budgets, load tests; run intentionally",
]
