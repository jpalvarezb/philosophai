<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhilosophAI - Knowledge Graph RAG</title>
    <link rel="icon" href="data:,">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        /* Vintage pixel cursors */
        :root {
            /* cursor vars could go here */
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 0;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            cursor: var(--cursor-arrow);
        }
        a, button, [role="button"], .citation-ref {
            cursor: pointer;
        }

        #chatbox, #graph-container, canvas, .chat-header {
            cursor: default;
        }

        #chatbox.dragging {
            cursor: grabbing;
        }

        input, textarea, [contenteditable="true"] {
            cursor: text;
        }

        body.waiting, body.waiting * {
            cursor: wait !important;
        }

        #graph-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #graph-container canvas {
            image-rendering: pixelated;
        }

        #chatbox {
            position: absolute;
            top: 64px;
            left: 44px;
            width: min(460px, 90vw);
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow: visible;
            z-index: 20;
            cursor: default;
        }

        /* The White Outline (Drag Handle) */
        #chatbox::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: #fff;
            z-index: -1;
            /* Stepped pixel corner (missing 4px block) */
            clip-path: polygon(
                4px 0, calc(100% - 4px) 0,
                calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
                calc(100% - 4px) 100%, 4px 100%,
                4px calc(100% - 4px), 0 calc(100% - 4px),
                0 4px, 4px 4px
            );
            pointer-events: auto;
        }

        /* The Black Background */
        #chatbox::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #000;
            z-index: -1;
            /* Match the stepped corner */
            clip-path: polygon(
                4px 0, calc(100% - 4px) 0,
                calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
                calc(100% - 4px) 100%, 4px 100%,
                4px calc(100% - 4px), 0 calc(100% - 4px),
                0 4px, 4px 4px
            );
            pointer-events: none;
        }

        #chatbox.dragging {
            cursor: grabbing;
        }

        /* Corner controls: bottom-left (gesture + reset) */
        #corner-left-actions {
            position: absolute;
            left: 16px;
            bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
            background: transparent;
            padding: 0;
        }

        #corner-left-actions .icon-btn {
            width: 28px;
            height: 28px;
        }
        #corner-left-actions .icon-btn svg {
            width: 28px;
            height: 28px;
        }

        .chat-header {
            padding: 24px 16px;
            border-bottom: 3px solid #fff;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: none;
            color: #fff;
            display: flex;
            align-items: center;
            user-select: none;
            position: relative;
        }

        .chat-header span:first-child {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .chat-header span:last-child {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 0.06em;
            font-weight: normal;
            font-family: 'VT323', monospace;
        }

        #chat-log {
            max-height: 60vh;
            padding: 14px 16px 20px 16px;
            /* Keep the scrollbar/viewport above the bottom overlay area */
            margin-bottom: var(--chat-bottom-safe);

            overflow-y: auto;
            font-size: var(--chat-font-sm, 16px);
            scrollbar-width: thin;
            scrollbar-color: #fff transparent;
            image-rendering: pixelated;
            position: relative;
            z-index: 1;
        }

        /* Full-width bottom overlay so bottom controls never compete with chat text visually. */
        #chat-bottom-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--chat-bottom-safe);
            background: #000;
            z-index: 25;
            pointer-events: none;
        }

        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 0;
        }

        .chat-line {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
            align-items: flex-start;
            line-height: 1.2;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 0;
        }

        .chat-line:last-child {
            margin-bottom: 0;
        }

        .chat-line .prompt-symbol {
            color: #fff;
            flex-shrink: 0;
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .chat-line.user .prompt-symbol,
        .chat-line.system .prompt-symbol {
            color: #fff;
        }

        .chat-line .line-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chat-line .line-text p {
            margin: 0 0 0.6em 0;
        }
        .chat-line .line-text p:last-child {
            margin-bottom: 0;
        }
        .chat-line .line-text ul,
        .chat-line .line-text ol {
            margin: 0 0 0.6em 1.2em;
            padding: 0;
        }
        .chat-line .line-text code {
            background: rgba(255, 255, 255, 0.12);
            padding: 0 4px;
        }
        .chat-line .line-text pre {
            background: #000;
            border: 1px solid #fff;
            padding: 8px;
            overflow: auto;
        }
        .chat-line .line-text a {
            color: #00ff8a;
        }

        .chat-line.thinking .line-text {
            color: #fff;
        }

        #prompt-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            /* When prompt-row lives inside #chat-log (which is padded), avoid double-padding. */
            padding: 10px 0 0 0;
            background: #000;
            margin-top: 8px;
            font-size: 18px;
            line-height: 1.2;
            font-family: 'VT323', monospace;
            letter-spacing: 0;
        }

        #prompt-row .prompt-symbol {
            color: #fff;
            font-weight: normal;
            line-height: 1.2;
            font-size: 18px;
            letter-spacing: 0;
        }

        #prompt-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background: transparent;
            border: none;
            outline: none;
            caret-color: transparent;
            font: inherit;
            padding: 0;
            margin: 0;
            z-index: 10;
        }

        #prompt-display {
            flex: 1;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow: hidden;
            pointer-events: none;
            font: inherit;
            color: #fff;
            display: block;
            min-height: 1.2em;
        }

        .retro-caret {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #fff;
            animation: blink 1s step-end infinite;
            vertical-align: -2px;
        }

        #prompt-row:not(:focus-within) .retro-caret {
            animation: none;
            opacity: 0.5; /* Dim or hide when not focused? */
            background-color: transparent;
            border: 1px solid #fff; /* Hollow block when inactive */
            color: #fff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #prompt-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        #prompt-input:disabled {
            color: rgba(255, 255, 255, 0.35);
        }

        /* --- Chatbox UX upgrades (wrapping input, buttons, resizing, scaling) --- */
        #chatbox {
            /* Default resizable size; JS can override width/height inline */
            width: min(340px, 85vw);
            height: min(380px, 70vh);
            min-width: 260px;
            min-height: 120px;
            max-width: 92vw;
            max-height: 92vh;

            --chat-scale: 1;
            --chat-font-lg: calc(20px * var(--chat-scale));
            --chat-font-sm: calc(16px * var(--chat-scale));

            /* Space to keep chat content clear of bottom overlay controls (gesture/reset + resize handle). */
            --chat-bottom-safe: 72px;
        }

        #chatbox.collapsed {
            min-height: 0 !important;
            height: auto !important;
        }

        #chatbox.collapsed #chat-log,
        #chatbox.collapsed #prompt-row,
        #chatbox.collapsed #resize-handle,
        #chatbox.collapsed #corner-left-actions,
        #chatbox.collapsed #chat-bottom-overlay {
            display: none;
        }

        #chat-log {
            /* Override max-height layout so chatbox height is the source of truth */
            max-height: none;
            flex: 1;
            min-height: 40px;
        }

        .chat-line,
        .chat-line .prompt-symbol,
        #prompt-row,
        #prompt-row .prompt-symbol {
            font-size: var(--chat-font-lg);
        }

        /* Header: keep existing pixel font but allow scaling */
        .chat-header {
            gap: 10px;
            justify-content: space-between;
        }
        .chat-header span:first-child {
            font-size: calc(12px * var(--chat-scale));
        }

        .icon-btn {
            background: transparent;
            border: none;
            padding: 0;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            opacity: 1;
        }
        .icon-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
        }
        .icon-btn:hover:not(:disabled) {
            color: #00ff8a;
        }

        .icon-btn:focus-visible {
            outline: 2px solid #00ff8a;
            outline-offset: 2px;
        }

        /* Ensure ALL chatbox icons inherit the button color (so hover -> bright green works everywhere). */
        #chatbox button {
            color: #fff;
        }
        #chatbox button:hover:not(:disabled) {
            color: #00ff8a;
        }
        #chatbox button svg [fill]:not([fill="none"]) {
            fill: currentColor;
        }

        /* Header button placement (absolute, pixel-aligned) */
        #collapse-btn,
        #drag-btn,
        #save-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        #collapse-btn { right: 72px; }
        #drag-btn { right: 44px; }
        #save-btn { right: 16px; }

        #drag-btn {
            cursor: grab;
            touch-action: none;
        }
        #chatbox.dragging #drag-btn {
            cursor: grabbing;
        }


        /* Hide the legacy header gesture button (gesture control now lives bottom-right in the chatbox) */
        #gesture-btn-header {
            display: none;
        }

        /* Prompt row: wrap instead of scrolling horizontally */
        #prompt-row {
            align-items: flex-start;
        }
        #prompt-row .prompt-symbol {
            padding-top: 2px;
        }

        #prompt-input-wrap {
            position: relative;
            /* Fill available row width so the send icon lands near the right edge. */
            flex: 1 1 auto;
            min-width: 0;
            width: auto;
            max-width: none;
            display: flex;
            align-items: flex-start;
            overflow: auto;
            max-height: calc(1.2em * 6);
        }

        #prompt-display {
            width: 100%;
            overflow: visible;
        }

        #prompt-input {
            resize: none;
            white-space: pre-wrap;
            overflow: auto;
        }

        #prompt-actions {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-left: 6px;
            padding-top: 1px;
        }

        /* Ensure prompt-row controls never get accidentally absolutely positioned */
        #prompt-row #send-btn {
            position: static !important;
            right: auto !important;
            top: auto !important;
            bottom: auto !important;
            left: auto !important;
            transform: none !important;
        }

        /* Send button: pixelarticons arrow-right (24x24 grid, crisp at multiples of 24) */
        #send-btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            margin: 0;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #send-btn svg {
            width: 24px;
            height: 24px;
            shape-rendering: crispEdges;
            image-rendering: pixelated;
        }

        /* Gesture button: lives inside #corner-left-actions (no box) */
        #gesture-btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            color: #fff;
        }
        #gesture-btn svg {
            width: 20px;
            height: 20px;
        }
        #gesture-btn:hover:not(:disabled) {
            color: #00ff8a;
        }

        /* Resize/drag handle (bottom-right): diagonal line with arrows */
        #resize-handle {
            position: absolute;
            right: 12px;
            left: auto;
            bottom: 12px;
            /* Larger hit target (MDN recommends ~44x44 for interactive controls) */
            width: 44px;
            height: 44px;
            cursor: nwse-resize;
            touch-action: none;
            z-index: 30;
            background: transparent;
            border: none;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        #resize-handle svg {
            width: 28px;
            height: 28px;
            shape-rendering: crispEdges;
            image-rendering: pixelated;
        }

        #resize-handle:focus-visible {
            outline: 2px solid #00ff8a;
            outline-offset: 2px;
        }

        #citation-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #fff;
            padding: 10px;
            border-radius: 4px;
            max-width: 360px;
            font-size: 12px;
            color: #ddd;
            display: none;
            z-index: 100;
            pointer-events: auto; /* allow click-to-expand */
            user-select: text;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
        }

        #citation-tooltip .citation-tooltip-header {
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 0.04em;
        }

        #citation-tooltip .citation-tooltip-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 2px 10px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.85);
        }
        #citation-tooltip .citation-tooltip-k {
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }
        #citation-tooltip .citation-tooltip-v {
            color: rgba(255, 255, 255, 0.92);
            overflow-wrap: anywhere;
        }

        #citation-tooltip .citation-tooltip-snippet {
            color: #ddd;
            line-height: 1.25;
            max-height: 120px;
            overflow: hidden;
        }
        #citation-tooltip.expanded .citation-tooltip-snippet {
            max-height: 280px;
            overflow: auto;
        }

        #citation-tooltip .citation-tooltip-hint {
            margin-top: 10px;
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            letter-spacing: 0.04em;
            cursor: pointer;
            border: 2px solid #fff;
            /* slightly "pixel" feel */
            box-shadow: 2px 2px 0 0 #fff;
            user-select: none;
        }

        /* When collapsed: hint says "expand".
           Default = white outline + white text.
           Hover = filled white + black text. */
        #citation-tooltip .citation-tooltip-hint[data-mode="expand"] {
            background: transparent;
            color: #fff;
        }
        #citation-tooltip:hover .citation-tooltip-hint[data-mode="expand"] {
            background: #fff;
            color: #000;
        }

        /* When expanded: hint says "collapse".
           Default = filled white + black text.
           Hover = white outline + white text. */
        #citation-tooltip .citation-tooltip-hint[data-mode="collapse"] {
            background: #fff;
            color: #000;
        }
        #citation-tooltip:hover .citation-tooltip-hint[data-mode="collapse"] {
            background: transparent;
            color: #fff;
        }

        #chatbox .citation-ref {
            color: #00ff8a;
            cursor: pointer;
            font-weight: normal;
            text-decoration: none; /* underline only on hover */
            text-underline-offset: 2px;
            background: transparent;
            border: none;
            padding: 0;
            font: inherit;
        }
        #chatbox .citation-ref:hover {
            color: #00ff8a;
            text-decoration: underline;
            text-decoration-thickness: 2px;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 200;
            color: #00ff8a;
            letter-spacing: 0.1em;
            font-family: 'VT323', monospace;
            font-size: 14px;
            letter-spacing: 0.04em;
            image-rendering: pixelated;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 138, 0.2);
            border-top-color: #00ff8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

        <div class="spinner"></div>
        <div id="loading-text">Initializing System...</div>
    </div>

    <div id="graph-container"></div>

    <div id="chatbox" role="region" aria-label="Conversation window">
        <div class="chat-header">
            <span>PHILO-001</span>

            <!-- Legacy header gesture button (hidden via CSS). Gesture control is bottom-right. -->
            <button id="gesture-btn-header" class="icon-btn" title="Hand Gesture Control" aria-label="Hand Gesture Control">

    <script>
    // Global error handler to catch d3-force crashes
    window.onerror = function(msg, url, line, col, error) {
        if (typeof msg === 'string' && msg.includes("Cannot create property 'vx' on string")) {
            console.error("[CRITICAL] d3-force crash detected! Dumping graph data:", {
                dump: window.graphDataDump,
                stats: window.graphDataDumpStats,

                error,

            alert("System Error: Graph rendering crashed (vx on string). Check console for details.");

    <script>
    (function() {
        'use strict';

        const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        const API_BASE = isLocal && window.location.port !== '8000'
            ? `${window.location.protocol}//${window.location.hostname}:8000`
            : isLocal ? '' : window.location.origin;
        const WS_BASE = API_BASE ? API_BASE.replace(/^http/, 'ws') : `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`;
        const AGENT_WS_URL = `${WS_BASE}/api/ws/agent`;
        let Graph;
        let graphData = { nodes: [], links: [] };
        let nodesById = {};
        const allKnownNodes = new Map();
        const highlightNodes = new Set();
        const traversalNodes = new Set();
        const traversalLinks = new Set();
        const gestureHighlightNodes = new Set();
        let citationData = [];
        const citationStore = new Map(); // key: "answerId:index" -> citation
        let citationAnswerSeq = 0;
        let citationHoverSeq = 0;
        let chatboxRect = null;

        // Invariant watchdog: periodically checks the *internal* force-graph graphData() state.
        // Goal: catch any primitive nodes (strings) before/when the simulation crashes.
        const graphInvariant = {
            timer: null,
            lastBadKey: null,
            lastCheckedAt: 0,
        };

        function checkForceGraphInternalData(from) {
            if (!Graph || typeof Graph.graphData !== 'function') return;

            let gd = null;
            try { gd = Graph.graphData(); } catch (_) { return; }

            const nodes = (gd && Array.isArray(gd.nodes)) ? gd.nodes : [];
            const bad = nodes.filter(n => !n || typeof n !== 'object');
            if (!bad.length) return;

            const sample = bad.slice(0, 8).map(v => ({ type: typeof v, value: v }));
            const key = JSON.stringify(sample);
            if (key === graphInvariant.lastBadKey) return;

            graphInvariant.lastBadKey = key;
            window.graphDataDumpInternal = gd;
            console.error(`[WATCHDOG:${from}] force-graph internal nodes contains ${bad.length} primitive(s). Sample:`, sample);
            console.trace(`[WATCHDOG:${from}] stack trace`);
        }

        function startGraphInvariantWatchdog() {
            if (graphInvariant.timer != null) return;
            graphInvariant.timer = setInterval(() => {
                // Throttle a bit; on slow machines we don't want this to dominate.
                const now = performance.now();
                if (now - graphInvariant.lastCheckedAt < 450) return;
                graphInvariant.lastCheckedAt = now;
                checkForceGraphInternalData('interval');

        let autoFitTimer = null;

        let gestureLandmarker = null;
        let gestureRenderGraph = null;
        let gestureFetchSeq = 0;
        let gestureLastWaveTs = 0;
        let gesturePhysicsRaf = null;
        let gestureTwoHandMode = false;
        let gestureLastTwoHandTs = 0;
        let twoHandCandidateSince = 0;
        let twoHandLostSince = 0;
        const TWO_HAND_MIN_SEP = 0.12;
        const TWO_HAND_MAX_SEP = 0.85;
        const TWO_HAND_ENTER_MS = 140;
        const TWO_HAND_LOST_MS = 120;
        const gestureTwoHandHoldMs = 250;
        let lastVideoTime = -1;

        // State for Two-Hand Zoom Locking
        const zoomState = {
            active: false,
            startSeparation: 0,
            startZoomLevel: 1,
            startCenter: { x: 0, y: 0 },
            smoothFactor: 0.15, // Lower = smoother but more laggy
            lastSepValue: null, // previous separation for velocity tracking
            lastSepTs: 0,       // timestamp of last separation measurement
            lastAngle: null,    // previous frame's angle between two hands (radians) for rotation
            smoothAngle: null,  // EMA-smoothed angle for jitter-free rotation
            lastTwoHandCenter: null, // center point of two hands for panning

        // Smooth Physics State

            zoom: { current: 1, target: 1 },
            center: { x: 0, y: 0, targetX: 0, targetY: 0 },
            lastSep: null, // Normalized separation
            panVelocity: { vx: 0, vy: 0 },   // graph-coord units per second (pan momentum)

        const htmlEscapes = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

        function escapeHtml(str = '') {
            return String(str).replace(/[&<>"']/g, ch => htmlEscapes[ch]);

        function convertPixelPathToRects(svgEl) {
            // Some browsers can drop/anti-alias 1x1 subpaths inside a single <path> even at 1:1 sizing.
            // Converting the pixel-art path to <rect> elements makes the icon reliably crisp.
            if (!svgEl) return false;

            const path = svgEl.querySelector('path');
            if (!path) return false;

            const d = path.getAttribute('d') || '';
            const re = /M(\d+)\s+(\d+)h1v1h-1z/g;

            let m;
            const coords = [];
            const seen = new Set();
            while ((m = re.exec(d))) {
                const x = Number(m[1]);
                const y = Number(m[2]);
                const k = `${x},${y}`;
                if (seen.has(k)) continue;
                seen.add(k);
                coords.push({ x, y });
            }

            if (!coords.length) return false;

            const ns = 'http://www.w3.org/2000/svg';
            const parent = path.parentNode;

            // Prefer replacing within an existing <g> (keeps transforms like translate(2 2)).
            const g = (parent && parent.nodeType === 1 && parent.nodeName.toLowerCase() === 'g')
                ? parent
                : null;

            const target = g || svgEl;

            // Remove the original path.
            try { path.remove(); } catch (_) { if (path.parentNode) path.parentNode.removeChild(path); }

            if (target === svgEl) {
                // If there was no group, clear any remaining contents to avoid mixing nodes.
                while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
            }

            if (target.nodeName.toLowerCase() === 'g') {
                target.setAttribute('fill', 'currentColor');
                target.setAttribute('shape-rendering', 'crispEdges');
            } else {
                // Wrap in a group so fill can be inherited cleanly.
                const wrap = document.createElementNS(ns, 'g');
                wrap.setAttribute('fill', 'currentColor');
                wrap.setAttribute('shape-rendering', 'crispEdges');
                svgEl.appendChild(wrap);
                coords.forEach(({ x, y }) => {
                    const r = document.createElementNS(ns, 'rect');
                    r.setAttribute('x', String(x));
                    r.setAttribute('y', String(y));
                    r.setAttribute('width', '1');
                    r.setAttribute('height', '1');
                    wrap.appendChild(r);
                });
                return true;
            }

            coords.forEach(({ x, y }) => {
                const r = document.createElementNS(ns, 'rect');
                r.setAttribute('x', String(x));
                r.setAttribute('y', String(y));
                r.setAttribute('width', '1');
                r.setAttribute('height', '1');
                target.appendChild(r);
            });

            return true;
        }

        function appendLine(role, text = '', options = {}) {

        function startThinkingLine() {

        function sanitizeAnswer(text, citations, { answerId = null } = {}) {
            if (!text) return '';

            const stripTrailingCitationInventory = (raw) => {
                // Models sometimes append a trailing "inventory" like:
                // [1] "Title", [2] "Title", ...
                // We already have structured citations in `citations`, so strip this block for clean UX.
                const input = String(raw ?? '');
                if (!input.trim()) return '';

                const splitParas = (s) => String(s).split(/\n\s*\n/);

                let paras = splitParas(input);
                const isInventoryPara = (p) => {
                    const t = String(p || '').trim();
                    if (!t) return false;

                    const lower = t.toLowerCase();
                    // Header-only paragraphs should be removed if they occur at the end.
                    // NOTE: Avoid embedded carriage returns in regex literals (can break parsing).
                    if (/^(sources|references|citations)\s*:?\s*$/i.test(t)) return true;

                    const cites = t.match(/\[\d+\]/g) || [];
                    if (cites.length < 2) return false; // reduce false positives

                    const startsWithCite = /^\s*\[\d+\]/.test(t);
                    const hasQuotes = /["“”]/.test(t);
                    const looksLikeMultilineList = /\n\s*\[\d+\]/.test(t);
                    if (startsWithCite && (hasQuotes || looksLikeMultilineList)) return true;

                    if (/^(sources|references|citations)\b/.test(lower) && cites.length >= 2) return true;

                    return false;
                };

                // Strip one or more trailing inventory-style paragraphs.
                while (paras.length) {
                    const last = paras[paras.length - 1];
                    if (!isInventoryPara(last)) break;
                    paras.pop();
                }

                // Also handle "Sources:" paragraph followed by an inventory paragraph.
                if (paras.length >= 2) {
                    const last = String(paras[paras.length - 1] || '').trim();
                    const prev = String(paras[paras.length - 2] || '').trim();
                    const prevLower = prev.toLowerCase();
                    const hasManyCites = (last.match(/\[\d+\]/g) || []).length >= 2;
                    if (/^(sources|references|citations)\b/.test(prevLower) && hasManyCites && /^\s*\[\d+\]/.test(last)) {
                        paras.pop();
                        paras.pop();
                    }
                }

                return paras.join('\n\n').trimEnd();
            };

            // Map chunk_id -> index for cases where the model returns [[chunk_id]] or [chunk_id]
            const chunkIdToIndex = new Map();
            const citationsByIndex = new Map();
            (citations || []).forEach(c => {
                if (c && c.chunk_id != null) {
                    chunkIdToIndex.set(String(c.chunk_id), c.index);
                }
                if (c && c.index != null) {
                    citationsByIndex.set(String(c.index), c);
                }
            });

            const cite = (num) => {
                const n = String(num);
                const c = citationsByIndex.get(n);
                // Use HTML entities for [ ] to avoid regex double-wrapping.
                const keyAttr = (answerId != null) ? ` data-cite="${answerId}:${n}"` : '';
                return c
                    ? `<button type="button" class="citation-ref" data-index="${n}"${keyAttr} aria-label="Open citation ${n}">&#91;${n}&#93;</button>`
                    : `[${n}]`;
            };

            const cleanedText = stripTrailingCitationInventory(text);
            let out = renderMarkdown(cleanedText);

            // Replace [[chunk_id]] or [chunk_id] with numeric citations if we have a mapping
            out = out.replace(/\[\[([^\]]+)\]\]|\[([^\]]+)\]/g, (match, g1, g2) => {
                const id = g1 || g2;
                if (!id) return match;
                const idx = chunkIdToIndex.get(id.trim());
                return idx ? cite(idx) : match;
            });

            // Handle grouped citations like [2, 3, 4]
            out = out.replace(/\[(\d+(?:\s*,\s*\d+)+)\]/g, (_match, nums) => {
                return String(nums)
                    .split(/\s*,\s*/)
                    .map(n => cite(n))
                    .join(', ');
            });

            // Handle single citations like [1]
            out = out.replace(/\[(\d+)\]/g, (_match, num) => cite(num));

            return out;
        }

        function updatePromptDisplay() {
            const val = promptInput.value;
            const start = promptInput.selectionStart;

            // Handle simple case: insertion caret

                const before = val.substring(0, start);
                const after = val.substring(start);
                html = escapeHtml(before) + '<span class="retro-caret"></span>' + escapeHtml(after);
            } else {
                // Selection range (optional: could highlight background)
                const before = val.substring(0, start);
                const sel = val.substring(start, end);
                const after = val.substring(end);
                html = escapeHtml(before) + `<span style="background:#fff;color:#000">${escapeHtml(sel)}</span>` + escapeHtml(after);
            }
            promptDisplay.innerHTML = html;

            // Sync scroll (textarea is the scroll source; wrapper scrolls the visible display)
            if (promptWrap) {
                promptWrap.scrollLeft = promptInput.scrollLeft;
                promptWrap.scrollTop = promptInput.scrollTop;
            }

        function dist3(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dz = (a.z || 0) - (b.z || 0);
            return Math.hypot(dx, dy, dz);
        }

        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        function getHandScale(landmarks) {
            const wrist = landmarks[0];
            const middleMCP = landmarks[9];
            if (!wrist || !middleMCP) return 0.1; // fallback
            return Math.hypot(wrist.x - middleMCP.x, wrist.y - middleMCP.y);
        }

        function isPinched(landmarks, { threshold = 0.55 } = {}) {
            const handScale = getHandScale(landmarks);
            if (handScale < 0.01) return { pinched: false, ratio: 1 };
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            if (!thumbTip || !indexTip) return { pinched: false, ratio: 1 };
            const d = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
            const ratio = d / handScale;
            return { pinched: ratio < threshold, ratio };
        }

        function angleAt(a, b, c) {
            // Returns angle ABC in radians.
            if (!a || !b || !c) return 0;
            const abx = a.x - b.x;
            const aby = a.y - b.y;
            const abz = (a.z || 0) - (b.z || 0);

            const cbx = c.x - b.x;
            const cby = c.y - b.y;
            const cbz = (c.z || 0) - (b.z || 0);

            const dot = abx * cbx + aby * cby + abz * cbz;
            const mag1 = Math.hypot(abx, aby, abz);
            const mag2 = Math.hypot(cbx, cby, cbz);
            const denom = mag1 * mag2;
            if (!Number.isFinite(denom) || denom < 1e-6) return 0;

            const cos = clamp(dot / denom, -1, 1);
            return Math.acos(cos);
        }

        function isFingerExtendedAngle(landmarks, mcp, pip, tip, { minAngle = 2.75, ratio = 1.06, minDelta = 0.018 } = {}) {
            // Robust extension test combining joint angle + wrist-distance guard.
            const wrist = landmarks[0];
            const m = landmarks[mcp];
            const p = landmarks[pip];
            const t = landmarks[tip];
            if (!wrist || !m || !p || !t) return false;

            const ang = angleAt(m, p, t);
            if (ang < minAngle) return false;

            const pipDist = dist3(p, wrist);
            const tipDist = dist3(t, wrist);
            const delta = tipDist - pipDist;

            return tipDist > pipDist * ratio || delta > minDelta;
        }

        function isIndexExtendedHybrid(landmarks) {
            const wrist = landmarks[0];
            const mcp = landmarks[5];
            const pip = landmarks[6];
            const tip = landmarks[8];
            if (!wrist || !mcp || !pip || !tip) return false;

            const byAngle = isFingerExtendedAngle(landmarks, 5, 6, 8, { minAngle: 2.55, ratio: 1.01, minDelta: 0.007 });
            if (byAngle) return true;

            const handScale = getHandScale(landmarks);
            const tipDist = dist3(tip, wrist);
            const pipDist = dist3(pip, wrist);
            const delta = tipDist - pipDist;
            const min = Math.max(0.006, handScale * 0.06);
            const yCue = (tip.y < pip.y - 0.015);

            return (delta > min) || yCue;
        }

        function palmCenter(landmarks) {
            const idxs = [0, 5, 9, 13, 17];
            let x = 0, y = 0;
            for (const i of idxs) {
                x += landmarks[i].x;
                y += landmarks[i].y;
            }
            return { x: x / idxs.length, y: y / idxs.length };
        }

        function classifyHand(landmarks) {
            // Angle-based extension reduces false positives when fingers are curled toward camera.
            const indexExt = isIndexExtendedHybrid(landmarks);
            const middleExt = isFingerExtendedAngle(landmarks, 9, 10, 12, { minAngle: 2.8, ratio: 1.08, minDelta: 0.02 });
            const ringExt = isFingerExtendedAngle(landmarks, 13, 14, 16, { minAngle: 2.8, ratio: 1.08, minDelta: 0.02 });
            const pinkyExt = isFingerExtendedAngle(landmarks, 17, 18, 20, { minAngle: 2.8, ratio: 1.08, minDelta: 0.02 });

            const extCount = [indexExt, middleExt, ringExt, pinkyExt].filter(Boolean).length;

            // Make "open" strict so pointing doesn't drift into panning.
            const open = extCount >= 3 && middleExt;
            const fist = extCount === 0;
            const point = indexExt && !ringExt && !pinkyExt && extCount <= 2;

            let gesture = 'other';
            if (open) gesture = 'open';
            else if (point) gesture = 'point';
            else if (fist) gesture = 'fist';

            const palm = palmCenter(landmarks);
            const indexTip = landmarks[8];

            return { gesture, palm, indexTip, extCount, indexExt, middleExt, ringExt, pinkyExt };
        }

        function mirroredPalmXY(hand) {
            if (!hand?.palm) return null;
            return { x: 1 - hand.palm.x, y: hand.palm.y };
        }

        function pickPrimaryHand(hands, now) {
            if (!hands?.length) return null;

            const withPalm = hands
                .map(h => ({ h, p: mirroredPalmXY(h) }))
                .filter(x => x.p);

            if (primaryHand.lastPalm && withPalm.length) {
                let best = null;
                let bestD2 = Infinity;
                for (const { h, p } of withPalm) {
                    const dx = p.x - primaryHand.lastPalm.x;
                    const dy = p.y - primaryHand.lastPalm.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < bestD2) { bestD2 = d2; best = h; }
                }
                return best || hands[0];
            }

            const pointer = hands.find(h => h.indexTip && (h.indexExt || h.gesture === 'point'));
            return pointer || hands[0];
        }

        function landmarkToScreen(pt) {
            // Mirror horizontally for natural interaction.
            return {
                x: (1 - pt.x) * window.innerWidth,
                y: pt.y * window.innerHeight,
            };
        }


        function findNearestNode(screenX, screenY) {
            if (!Graph) return null;
            const coords = Graph.screen2GraphCoords(screenX, screenY);
            if (!coords) return null;

            const candidates = (gestureRenderGraph && Array.isArray(gestureRenderGraph.nodes))
                ? gestureRenderGraph.nodes
                : graphData.nodes;

            let best = null;
            let bestD2 = Infinity;

            for (const node of candidates) {
                if (!node || !Number.isFinite(node.x) || !Number.isFinite(node.y)) continue;
                const dx = node.x - coords.x;
                const dy = node.y - coords.y;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestD2) {
                    bestD2 = d2;
                    best = node;
                }
            }

            const k = (Graph && typeof Graph.zoom === 'function') ? (Graph.zoom() || 1) : 1;
            // Larger threshold makes pointing usable; scales down as you zoom in.
            const threshold = 38 / k;
            return best && bestD2 <= threshold * threshold ? best : null;
        }

        const gestureActiveNeighborhood = new Set();

        function computeGestureActiveNeighborhood(centerId) {
            gestureActiveNeighborhood.clear();
            if (!centerId) return;
            const cid = String(centerId);
            gestureActiveNeighborhood.add(cid);

            const links = (graphData && Array.isArray(graphData.links)) ? graphData.links : [];
            for (const link of links) {
                if (!link) continue;
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                if (s == null || t == null) continue;
                const sid = String(s);
                const tid = String(t);
                if (sid === cid) gestureActiveNeighborhood.add(tid);
                else if (tid === cid) gestureActiveNeighborhood.add(sid);
            }
        }

        function refreshGestureHighlights() {
            gestureHighlightNodes.clear();
            gestureActiveNeighborhood.forEach(id => gestureHighlightNodes.add(id));
            if (gestureHoverNodeId) gestureHighlightNodes.add(gestureHoverNodeId);
            if (Graph) Graph.nodeCanvasObject(Graph.nodeCanvasObject());
        }

        function findShortestPath(startId, endId) {
            // BFS on graphData.links to find shortest path between two nodes.
            // Returns array of node IDs from start to end (inclusive), or [] if no path.
            if (!startId || !endId) return [];
            const sId = String(startId);

            // Suppress panning when two hands are detected (even during the entry dwell)
            // to prevent accidental pans while transitioning into two-hand mode.
            if (control.palm && !isTwoHand) {
                const palmX = 1 - control.palm.x; // mirrored
                const palmY = control.palm.y;
                if (mem.lastPalmX != null && mem.lastPalmY != null && mem.lastTs != null) {
                    const dt = now - mem.lastTs;
                    if (dt < 14 || dt > 250) {
                        mem.lastPalmX = palmX;
                        mem.lastPalmY = palmY;
                        mem.lastTs = now;
                    } else {
                        const dtSec = dt / 1000;
                        const filt = 0.35;
                        const fx = lerp(mem.lastPalmX, palmX, filt);
                        const fy = lerp(mem.lastPalmY, palmY, filt);

                        const vx = (fx - mem.lastPalmX) / dtSec;
                        const vy = (fy - mem.lastPalmY) / dtSec;

                        const fullyOpen = control.gesture === 'open' && (control.extCount || 0) >= 4;
                        if (fullyOpen) {
                            if (!mem.openSince) mem.openSince = now;
                        } else {
                            mem.openSince = 0;
                        }
                        const openStable = mem.openSince && (now - mem.openSince) > 120;

                        const vxC = clamp(vx, -3.0, 3.0);
                        const vyC = clamp(vy, -3.0, 3.0);

                        if (openStable && Math.abs(vxC) > 1.25 && Math.abs(vxC) > Math.abs(vyC) * 1.35) {
                            maybeHandleWave(vxC > 0 ? 'right' : 'left');
                        } else if (openStable) {
                            const palmSpeed = Math.hypot(vxC, vyC);
                            const dx = (fx - mem.lastPalmX) * window.innerWidth;
                            const dy = (fy - mem.lastPalmY) * window.innerHeight;
                            if (palmSpeed > 0.15 && Math.hypot(dx, dy) > 3) {
                                // Active movement: pan and update velocity
                                handlePan(dx, dy, dtSec);
                            }
                            // When hand is stationary (palmSpeed <= 0.15), panActive stays false
                            // so the physics loop will apply momentum/inertia from the last velocity.
                        }

                        mem.lastPalmX = fx;
                        mem.lastPalmY = fy;
                        mem.lastTs = now;
                    }
                } else {
                    mem.lastPalmX = palmX;
                    mem.lastPalmY = palmY;
                    mem.lastTs = now;
                }
            }

            // Pinch-to-select (prevents accidental triggers from passive pointing)
            // Selects the hovered node and highlights its 1-hop neighborhood within the current graph.
            //
            // Unpinch-to-deselect:
            // - Pinch on empty space (no hovered node) arms a clear.
            // - Releasing (unpinch) then clears the selected neighborhood (like a background click).
            const pinch = isPinched(control.landmarks);
            const wasPinched = !!mem.lastPinch;
            const pointBias = control.gesture === 'point' || (control.indexExt && (control.extCount || 0) <= 2);
            const pinchDownThreshold = pointBias ? 0.42 : 0.55;
            const pinchUpThreshold = pointBias ? 0.52 : 0.65;
            const pinchedNow = wasPinched ? (pinch.ratio < pinchUpThreshold) : (pinch.ratio < pinchDownThreshold);

            // Frame-count confirmation: require 2 consecutive pinched frames before triggering pinchDown.
            if (pinchedNow && !wasPinched) {
                gestureSelect.pinchFrameCount += 1;
            } else if (!pinchedNow) {
                gestureSelect.pinchFrameCount = 0;
            }
            const PINCH_CONFIRM_FRAMES = 2;
            const confirmedPinch = pinchedNow && (wasPinched || gestureSelect.pinchFrameCount >= PINCH_CONFIRM_FRAMES);

            const pinchDown = !wasPinched && confirmedPinch;
            const pinchUp = wasPinched && !pinchedNow;
            mem.lastPinch = confirmedPinch || (wasPinched && pinchedNow);

            const DRAG_THRESHOLD_PX = 15; // screen-px movement to distinguish drag from select
            const DOUBLE_PINCH_WINDOW = 500; // ms window for double-pinch detection

            if (pinchDown) {
                // Double-pinch detection: two pinchDown events within the window → force deselect only.
                const timeSinceLastUp = now - (gestureSelect.lastPinchUpTs || 0);
                const isDoublePinch = timeSinceLastUp < DOUBLE_PINCH_WINDOW && gestureActiveNodeId;

                if (isDoublePinch) {
                    gestureClearSelection({ clearHistory: false });
                } else if (gestureHoverNodeId) {
                    // Single pinch on a node: select it and start potential drag.
                    gestureTraverseTo(gestureHoverNodeId, { pushHistory: true });
                    gestureSelect.dragNodeId = gestureHoverNodeId;
                    gestureSelect.dragStartX = mem.pointerX;
                    gestureSelect.dragStartY = mem.pointerY;
                    // Pin the node (same as force-graph drag start).
                    const nodes = (graphData && Array.isArray(graphData.nodes)) ? graphData.nodes : [];
                    const dragNode = nodes.find(n => n && String(n.id) === String(gestureHoverNodeId));
                    if (dragNode && Number.isFinite(dragNode.x) && Number.isFinite(dragNode.y)) {
                        dragNode.fx = dragNode.x;
                        dragNode.fy = dragNode.y;
                    }
                }
            }

            // While holding pinch and dragging a node, update its position to follow the hand.
            if (mem.lastPinch && gestureSelect.dragNodeId && mem.pointerX != null && mem.pointerY != null) {
                const nodes = (graphData && Array.isArray(graphData.nodes)) ? graphData.nodes : [];
                const dragNode = nodes.find(n => n && String(n.id) === String(gestureSelect.dragNodeId));
                if (dragNode && Graph) {
                    const graphPos = Graph.screen2GraphCoords(mem.pointerX, mem.pointerY);
                    if (graphPos && Number.isFinite(graphPos.x) && Number.isFinite(graphPos.y)) {
                        dragNode.fx = graphPos.x;
                        dragNode.fy = graphPos.y;
                        dragNode.x = graphPos.x;
                        dragNode.y = graphPos.y;
                    }
                }
            }

            if (pinchUp) {
                gestureSelect.lastPinchUpTs = now;

                if (gestureSelect.dragNodeId) {
                    // Determine if this was a drag or a tap based on movement.
                    const dx = (mem.pointerX || 0) - (gestureSelect.dragStartX || 0);
                    const dy = (mem.pointerY || 0) - (gestureSelect.dragStartY || 0);
                    const movedDistance = Math.hypot(dx, dy);
                    const wasDrag = movedDistance > DRAG_THRESHOLD_PX;

                    if (wasDrag) {
                        // Drag completed: leave node pinned at drop location, reheat sim.
                        if (Graph && typeof Graph.d3ReheatSimulation === 'function') {
                            Graph.d3ReheatSimulation();
                        }
                    } else {
                        // Tap (no drag): unpin the node.
                        const nodes = (graphData && Array.isArray(graphData.nodes)) ? graphData.nodes : [];
                        const dragNode = nodes.find(n => n && String(n.id) === String(gestureSelect.dragNodeId));
                        if (dragNode) {
                            dragNode.fx = undefined;
                            dragNode.fy = undefined;
                        }
                    }
                    gestureSelect.dragNodeId = null;
                    gestureSelect.dragStartX = null;
                    gestureSelect.dragStartY = null;
                }
            }

            mem.lastGesture = control.gesture;
        }

        async function startGestureControl() {
            if (gestureEnabled) return;

            const videoEl = document.getElementById('gesture-video');
            if (!videoEl) {
                console.error('gesture video element missing');

            appendLine('system', 'Allow camera access for hand gestures.');

            gestureEnabled = true;

            };
            gestureRenderGraph = Graph;
            gestureLastWaveTs = 0;
            refreshGestureHighlights();
            gestureTwoHandMode = false;

            twoHandLostSince = 0;
            gestureState.lastSep = null;
            gestureState.panVelocity.vx = 0;
            gestureState.panVelocity.vy = 0;

            gestureState.zoomVelocity = 0;
            gestureState.zoomActive = false;
            gestureSelect.hoverId = null;

            gestureSelect.dualPinchLastTs = 0;

            gestureSelect.dragStartY = null;
            zoomState.active = false;

            zoomState.smoothAngle = null;

            lastVideoTime = -1;
            lastPointerTs = 0;
            lastPointerX = null;
            lastPointerY = null;

            const gestureBtn = document.getElementById('gesture-btn');
            if (gestureBtn) gestureBtn.style.color = '#00ff8a';

            // Initialize Physics State
            if (Graph) {
                const k = Graph.zoom();
                const center = Graph.screen2GraphCoords(window.innerWidth / 2, window.innerHeight / 2) || { x: 0, y: 0 };
                gestureState.zoom.current = k;
                gestureState.zoom.target = k;
                gestureState.center.x = center.x;
                gestureState.center.targetX = center.x;
                gestureState.center.y = center.y;
                gestureState.center.targetY = center.y;
                gestureState.lastSep = null;
            }

            startGesturePhysics();

            // Explicitly request camera permission
            let stream;
            try {
                if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                    throw new Error('getUserMedia not supported');
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                    audio: false,
                });
                videoEl.srcObject = stream;
                await videoEl.play();
                appendLine('system', 'Camera enabled. Gestures:\n• Point to hover nodes\n• Pinch to select and drag a node (double pinch to clear)\n• Open palm to pan; left/right/up/down\n• Two hands to zoom and rotate');
            } catch (err) {
                console.error('getUserMedia failed', err);
                const name = err && err.name ? err.name : 'Error';
                if (name === 'NotAllowedError' || name === 'SecurityError') {
                    appendLine('system', 'Camera blocked. Allow camera access in your browser site settings and try again.');
                } else if (name === 'NotFoundError') {
                    appendLine('system', 'No camera device found.');
                } else {
                    appendLine('system', 'Camera failed to start.');
                }
                stopGestureControl();
                return;
            }

            // Initialize MediaPipe Tasks Vision HandLandmarker (matches Trinkets/HandSphereThreeJs)
            let FilesetResolver, HandLandmarker;
            try {
                ({ FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm'));
            } catch (err) {
                console.error('tasks-vision import failed', err);
                appendLine('system', 'Failed to load MediaPipe Tasks Vision. Check your internet connection and try again.');
                stopGestureControl();
                return;
            }

            let vision;
            try {
                vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
            } catch (err) {
                console.error('forVisionTasks failed', err);
                appendLine('system', 'Failed to initialize MediaPipe vision runtime.');
                stopGestureControl();
                return;
            }

            try {
                gestureLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU',
                    },
                    runningMode: 'VIDEO',
                    numHands: 2,
                });
            } catch (err) {
                console.error('HandLandmarker init failed (GPU). Retrying with CPU...', err);
                try {
                    gestureLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                            delegate: 'CPU',
                        },
                        runningMode: 'VIDEO',
                        numHands: 2,
                    });
                } catch (err2) {
                    console.error('HandLandmarker init failed (CPU)', err2);
                    appendLine('system', 'Failed to initialize HandLandmarker.');
                    stopGestureControl();
                    return;
                }
            }

            const pump = () => {
                if (!gestureEnabled || !gestureLandmarker || !videoEl || !videoEl.srcObject) return;
                try {
                    const now = performance.now();
                    const videoTime = videoEl.currentTime;
                    if (videoTime === lastVideoTime) {
                        requestAnimationFrame(pump);
                        return;
                    }
                    lastVideoTime = videoTime;
                    const r = (typeof gestureLandmarker.detectForVideo === 'function')
                        ? gestureLandmarker.detectForVideo(videoEl, now)
                        : gestureLandmarker.detect(videoEl);

                    const mpLike = {
                        multiHandLandmarks: r?.landmarks || [],
                        multiHandedness: r?.handednesses || r?.handedness || [],
                    };
                    onGestureResults(mpLike);
                } catch (err) {
                    console.error('HandLandmarker detect failed', err);
                    // Keep pumping; transient errors happen during camera warmup/background tab.
                }
                requestAnimationFrame(pump);
            };
            requestAnimationFrame(pump);
        }

        const gestureBtn = document.getElementById('gesture-btn');
        if (gestureBtn) {
            gestureBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (gestureEnabled) {

                const ok = confirm('Enable camera for hand gesture control?');

        if (collapseBtn) {
