<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhilosophAI - Knowledge Graph RAG</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
        }

        #graph-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #terminal-output {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 400px;
            max-height: 70vh;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 13px;
        }

        #terminal-output::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        .term-header {
            color: #666;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .citation-ref { color: #00ff00; cursor: pointer; }
        .citation-ref:hover { text-decoration: underline; }

        #terminal-input-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 90%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            z-index: 20;
            font-size: 16px;
            padding: 10px;
            border-radius: 4px;
        }

        .term-prompt {
            color: #fff;
            margin-right: 10px;
            white-space: pre;
            font-weight: bold;
        }

        #query-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
        }

        #graph-info {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #666;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }
        
        #citation-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ff00;
            padding: 10px;
            max-width: 300px;
            font-size: 12px;
            color: #ddd;
            display: none;
            z-index: 100;
            pointer-events: none;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 200;
            flex-direction: column;
            color: #00ff00;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 0, 0.3);
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #query-btn { display: none; } 
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Initializing System...</div>
    </div>

    <div id="graph-info">
        <div>NODES: <span id="node-count">-</span></div>
        <div>EDGES: <span id="edge-count">-</span></div>
    </div>

    <div id="terminal-output">
        <div class="term-header">SYSTEM OUTPUT</div>
        <div id="answer-text"></div>
        <div id="citations-section" style="margin-top:15px; display:none;">
            <div class="term-header">SOURCES</div>
            <div id="citations-list"></div>
        </div>
        <div id="traversal-stats" style="margin-top:15px; display:none; color: #00ff00;">
            > Traversal: <span id="nodes-visited">0</span> nodes, <span id="edges-traversed">0</span> edges
        </div>
        <div id="status" style="margin-top:10px; color: #666;">
            > Status: <span id="status-text">Ready</span>
        </div>
    </div>

    <div id="terminal-input-container">
        <span class="term-prompt">[</span>
        <input type="text" id="query-input" placeholder="Enter query..." autocomplete="off">
        <span class="term-prompt">]....</span>
        <button id="query-btn" style="display:none"></button>
    </div>

    <div id="graph-container"></div>
    
    <div id="citation-tooltip"></div>

    <script src="//cdn.jsdelivr.net/npm/force-graph"></script>
    <script>
    (function() {
        const API_BASE = 'http://localhost:8000';
        let Graph;
        let graphData = { nodes: [], links: [] };
        let nodesById = {};
        let linksById = {}; 
        let allKnownNodes = new Map(); // Cache all fetched nodes, even if filtered out
        let highlightNodes = new Set();
        let traversalNodes = new Set();
        let traversalLinks = new Set();
        let citationData = [];

        function initGraph() {
            const container = document.getElementById('graph-container');
            
            Graph = ForceGraph()(container)
                .backgroundColor('#000000')
                .width(window.innerWidth)
                .height(window.innerHeight)
                .nodeCanvasObject((node, ctx, globalScale) => {
                    const label = node.label || node.id;
                    const fontSize = 12 / globalScale;
                    ctx.font = `${fontSize}px "Courier New", monospace`;
                    
                    const r = 4 + Math.sqrt(node.val || 0);

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r, 0, 2 * Math.PI, false);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                    
                    if (highlightNodes.has(node.id) || traversalNodes.has(node.id)) {
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 2 / globalScale;
                    } else {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1 / globalScale;
                    }
                    ctx.stroke();

                    if (globalScale > 0.8 || highlightNodes.has(node.id) || traversalNodes.has(node.id) || node.val > 10) {
                        ctx.fillStyle = '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, node.x, node.y);
                    }
                })
                .linkCanvasObject((link, ctx, globalScale) => {
                    const start = link.source;
                    const end = link.target;
                    if (typeof start !== 'object' || typeof end !== 'object') return;

                    const curvature = 0.2;
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist === 0) return;
                    
                    const midX = (start.x + end.x) / 2;
                    const midY = (start.y + end.y) / 2;
                    const nx = -dy / dist;
                    const ny = dx / dist;
                    const cpX = midX + nx * dist * curvature;
                    const cpY = midY + ny * dist * curvature;
                    
                    const isTraversal = traversalLinks.has(`${start.id}-${end.id}`) || traversalLinks.has(`${end.id}-${start.id}`);
                    
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
                    ctx.strokeStyle = isTraversal ? '#00ff00' : 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = (isTraversal ? 2 : 0.5) / globalScale;
                    ctx.stroke();
                    
                    const label = link.label || link.type;
                    if (label && globalScale > 1.2) {
                        const t = 0.5;
                        const bx = (1-t)*(1-t)*start.x + 2*(1-t)*t*cpX + t*t*end.x;
                        const by = (1-t)*(1-t)*start.y + 2*(1-t)*t*cpY + t*t*end.y;
                        const angle = Math.atan2(dy, dx);
                        
                        ctx.save();
                        ctx.translate(bx, by);
                        ctx.rotate(angle);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = isTraversal ? '#00ff00' : '#ffffff';
                        const fontSize = 8 / globalScale;
                        ctx.font = `${fontSize}px "Courier New", monospace`;
                        ctx.fillText(label, 0, -2/globalScale);
                        ctx.restore();
                    }
                })
                .onNodeClick(node => {
                    highlightNodes.clear();
                    if (node) {
                        highlightNodes.add(node.id);
                        if (node.neighbors) node.neighbors.forEach(n => highlightNodes.add(n.id));
                    }
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                })
                .onBackgroundClick(() => {
                    highlightNodes.clear();
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                });
                
            Graph.d3Force('charge').strength(-120);
            Graph.d3Force('link').distance(120);
        }

        async function loadGraph() {
            try {
                // Fetch a larger dataset to ensure we get the main structure
                const res = await fetch(`${API_BASE}/api/graph?limit=5000`);
                if (!res.ok) throw new Error('Failed to load graph');
                let rawData = await res.json();
                
                // 1. Build an adjacency list for the raw data to find connected components
                const allNodes = new Map();
                rawData.nodes.forEach(n => {
                    allNodes.set(n.id, n);
                    allKnownNodes.set(n.id, n); // Keep a cache of all nodes fetched
                });
                
                const adj = new Map();
                rawData.nodes.forEach(n => adj.set(n.id, []));
                
                // Only consider links where both source and target exist in the node list
                const validLinks = rawData.links.filter(l => allNodes.has(l.source) && allNodes.has(l.target));
                
                validLinks.forEach(link => {
                    adj.get(link.source).push(link.target);
                    adj.get(link.target).push(link.source);
                });

                // 2. Find Connected Components
                const visited = new Set();
                const components = [];
                
                for (const nodeId of allNodes.keys()) {
                    if (!visited.has(nodeId)) {
                        const component = [];
                        const queue = [nodeId];
                        visited.add(nodeId);
                        
                        while (queue.length > 0) {
                            const u = queue.shift();
                            component.push(u);
                            
                            const neighbors = adj.get(u) || [];
                            for (const v of neighbors) {
                                if (!visited.has(v)) {
                                    visited.add(v);
                                    queue.push(v);
                                }
                            }
                        }
                        components.push(component);
                    }
                }
                
                console.log(`Found ${components.length} components. Sizes:`, components.map(c => c.length).sort((a,b) => b-a).slice(0, 10));

                if (components.length === 0) return;

                // 3. Keep only the largest component
                const largestComponentIds = new Set(components.reduce((a, b) => a.length > b.length ? a : b));
                
                // Filter nodes and links to this component
                let mainNodes = rawData.nodes.filter(n => largestComponentIds.has(n.id));
                let mainLinks = validLinks.filter(l => largestComponentIds.has(l.source) && largestComponentIds.has(l.target));

                // 4. (Optional) Apply the "Top 1 per community" filter to reduce clutter within the main graph
                // Calculate degrees for the main graph
                const nodeDegrees = new Map();
                mainNodes.forEach(n => nodeDegrees.set(n.id, 0));
                mainLinks.forEach(l => {
                    nodeDegrees.set(l.source, (nodeDegrees.get(l.source) || 0) + 1);
                    nodeDegrees.set(l.target, (nodeDegrees.get(l.target) || 0) + 1);
                });

                // Group by community
                const nodesByCommunity = {};
                mainNodes.forEach(n => {
                    const comm = n.community || 'unknown';
                    if (!nodesByCommunity[comm]) nodesByCommunity[comm] = [];
                    // Update node value with degree for sizing
                    n.val = nodeDegrees.get(n.id); 
                    nodesByCommunity[comm].push(n);
                });

                // Select top node per community
                const finalNodes = [];
                Object.values(nodesByCommunity).forEach(commNodes => {
                    // Sort by degree (descending) and take the highest-degree node
                    commNodes.sort((a, b) => b.val - a.val);
                    if (commNodes[0]) {
                        finalNodes.push(commNodes[0]);
                    }
                });
                
                const finalNodeIds = new Set(finalNodes.map(n => n.id));
                const finalLinks = mainLinks.filter(l => finalNodeIds.has(l.source) && finalNodeIds.has(l.target));

                // Remove nodes that don't participate in any remaining links to avoid isolated halo nodes
                const linkedNodeIds = new Set();
                finalLinks.forEach(link => {
                    linkedNodeIds.add(link.source);
                    linkedNodeIds.add(link.target);
                });
                const connectedFinalNodes = finalNodes.filter(node => linkedNodeIds.has(node.id));
                const connectedNodeIds = new Set(connectedFinalNodes.map(n => n.id));
                const connectedFinalLinks = finalLinks.filter(link => connectedNodeIds.has(link.source) && connectedNodeIds.has(link.target));

                // 5. Final assignment
                graphData = { nodes: connectedFinalNodes, links: connectedFinalLinks };
                
                // Re-build lookup maps for the visualizer
                nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));
                
                // Prepare neighbors arrays for hover effects
                graphData.nodes.forEach(n => { n.neighbors = []; });
                graphData.links.forEach(link => {
                    // In ForceGraph, links might be objects after initialization, but here they are raw IDs
                    const src = nodesById[link.source];
                    const tgt = nodesById[link.target];
                    if (src && tgt) {
                        src.neighbors.push(tgt);
                        tgt.neighbors.push(src);
                    }
                });

                Graph.graphData(graphData);
                
                document.getElementById('node-count').innerText = graphData.nodes.length;
                document.getElementById('edge-count').innerText = graphData.links.length;
                document.getElementById('loading').style.display = 'none';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-text').innerText = 'Error: ' + err.message;
            }
        }

        async function runQuery() {
            const question = document.getElementById('query-input').value.trim();
            if (!question) return;
            
            setStatus('pending', 'Thinking...');
            document.getElementById('terminal-output').style.display = 'block';
            document.getElementById('answer-text').innerText = '...';
            document.getElementById('citations-section').style.display = 'none';
            document.getElementById('traversal-stats').style.display = 'none';
            
            traversalNodes.clear();
            traversalLinks.clear();
            highlightNodes.clear();
            citationData = [];
            
            try {
                const res = await fetch(`${API_BASE}/api/agent/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, max_iterations: 25, verbose: false })
                });
                
                if (!res.ok) throw new Error('Query failed');
                
                const data = await res.json();
                
                if (data.traversal && data.traversal.edges) {
                    data.traversal.edges.forEach(edge => {
                        const srcId = edge.source;
                        const tgtId = edge.target;
                        traversalLinks.add(`${srcId}-${tgtId}`);
                        traversalNodes.add(srcId);
                        traversalNodes.add(tgtId);
                        // Add link if not present
                        const exists = graphData.links.some(l => (l.source === srcId && l.target === tgtId) || (l.source === tgtId && l.target === srcId));
                        if (!exists) {
                            graphData.links.push({ source: srcId, target: tgtId, label: edge.label || edge.type || '' });
                        }

                        // Ensure nodes exist; restore from cache when possible
                        if (!nodesById[srcId]) {
                            const cached = allKnownNodes.get(srcId);
                            const newNode = cached ? { ...cached, _dynamic: true, neighbors: [], links: [], val: cached.val || 5 } : {
                                id: srcId, label: srcId, val: 1, neighbors: [], links: [], _dynamic: true
                            };
                            graphData.nodes.push(newNode);
                            nodesById[srcId] = newNode;
                        }
                        if (!nodesById[tgtId]) {
                            const cached = allKnownNodes.get(tgtId);
                            const newNode = cached ? { ...cached, _dynamic: true, neighbors: [], links: [], val: cached.val || 5 } : {
                                id: tgtId, label: tgtId, val: 1, neighbors: [], links: [], _dynamic: true
                            };
                            graphData.nodes.push(newNode);
                            nodesById[tgtId] = newNode;
                        }
                    });
                }
                 if (data.collected_entities) {
                    data.collected_entities.forEach(id => {
                        // Restore if missing
                        if (!nodesById[id]) {
                            const cached = allKnownNodes.get(id);
                            const newNode = cached ? { ...cached, _dynamic: true, neighbors: [], links: [], val: cached.val || 5 } : {
                                id, label: id, val: 1, neighbors: [], links: [], _dynamic: true
                            };
                            graphData.nodes.push(newNode);
                            nodesById[id] = newNode;
                        }
                        traversalNodes.add(id);
                    });
                }
                
                // Rebuild neighbors/links for newly added nodes
                graphData.nodes.forEach(n => { n.neighbors = n.neighbors || []; });
                graphData.links.forEach(link => {
                    const src = typeof link.source === 'object' ? link.source : nodesById[link.source];
                    const tgt = typeof link.target === 'object' ? link.target : nodesById[link.target];
                    if (src && tgt) {
                        src.neighbors.push(tgt);
                        tgt.neighbors.push(src);
                    }
                });
                // Force ForceGraph to ingest the updated dataset (includes nodes outside initial view)
                Graph.graphData({
                    nodes: graphData.nodes,
                    links: graphData.links
                });

                Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                
                citationData = data.citations || [];
                document.getElementById('answer-text').innerHTML = formatAnswerWithCitations(data.answer, citationData);
                
                if (citationData.length > 0) {
                    document.getElementById('citations-section').style.display = 'block';
                    document.getElementById('citations-list').innerHTML = citationData.slice(0, 5).map(c => 
                        `<div>[${c.index}] ${c.preview}</div>`
                    ).join('');
                }
                
                if (traversalNodes.size > 0) {
                    document.getElementById('traversal-stats').style.display = 'block';
                    document.getElementById('nodes-visited').innerText = traversalNodes.size;
                    document.getElementById('edges-traversed').innerText = traversalLinks.size;
                }
                
                setStatus('ready', 'Done');
                setupCitationHover();
                
            } catch (err) {
                console.error(err);
                setStatus('error', err.message);
                document.getElementById('answer-text').innerText = 'Error: ' + err.message;
            }
        }
        
        function formatAnswerWithCitations(text, citations) {
            if (!text) return '';
            return text.replace(/\[(\d+)\]/g, (match, num) => {
                const c = citations.find(cit => cit.index === parseInt(num));
                return c ? `<span class="citation-ref" data-index="${num}">[${num}]</span>` : match;
            });
        }
        
        function setupCitationHover() {
            const tooltip = document.getElementById('citation-tooltip');
            document.querySelectorAll('.citation-ref').forEach(el => {
                el.addEventListener('mouseenter', e => {
                    const idx = parseInt(el.dataset.index);
                    const c = citationData.find(cit => cit.index === idx);
                    if (c) {
                        tooltip.innerText = c.full_content || c.preview;
                        tooltip.style.left = e.pageX + 10 + 'px';
                        tooltip.style.top = e.pageY - 20 + 'px';
                        tooltip.style.display = 'block';
                        
                        if (c.node_ids && c.node_ids.length) {
                             highlightNodes.clear();
                             c.node_ids.forEach(nid => highlightNodes.add(nid));
                             Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                             
                             const node = nodesById[c.node_ids[0]];
                             if (node) {
                                 Graph.centerAt(node.x, node.y, 1000);
                                 Graph.zoom(3, 2000);
                             }
                        }
                    }
                });
                el.addEventListener('mouseleave', () => {
                    tooltip.style.display = 'none';
                    highlightNodes.clear();
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                });
            });
        }

        function setStatus(state, msg) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text').style.color = state === 'error' ? 'red' : (state === 'pending' ? 'yellow' : '#666');
        }

        window.addEventListener('resize', () => {
            if (Graph) Graph.width(window.innerWidth).height(window.innerHeight);
        });

        document.getElementById('query-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') runQuery();
        });

        initGraph();
        loadGraph();
    })();
    </script>
</body>
</html>
