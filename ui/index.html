<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhilosophAI - Knowledge Graph RAG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        /* Vintage pixel cursors */
        :root {

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 0;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            cursor: var(--cursor-arrow);
        }
        a, button, [role="button"], .citation-ref {
            cursor: pointer;
        }

        #chatbox, #graph-container, canvas, .chat-header {
            cursor: default;
        }

        #chatbox.dragging {
            cursor: grabbing;
        }

        input, textarea, [contenteditable="true"] {
            cursor: text;
        }

        body.waiting, body.waiting * {
            cursor: wait !important;
        }

        #graph-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #graph-container canvas {
            image-rendering: pixelated;
        }

        #chatbox {
            position: absolute;
            top: 64px;
            left: 44px;
            width: min(460px, 90vw);
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow: visible;
            z-index: 20;
            cursor: default;
        }

        /* The White Outline (Drag Handle) */
        #chatbox::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: #fff;
            z-index: -1;
            /* Stepped pixel corner (missing 4px block) */
            clip-path: polygon(
                4px 0, calc(100% - 4px) 0, 
                calc(100% - 4px) 4px, 100% 4px, 
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
                calc(100% - 4px) 100%, 4px 100%, 
                4px calc(100% - 4px), 0 calc(100% - 4px),
                0 4px, 4px 4px
            );
            pointer-events: auto;
        }

        /* The Black Background */
        #chatbox::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #000;
            z-index: -1;
            /* Match the stepped corner */
            clip-path: polygon(
                4px 0, calc(100% - 4px) 0, 
                calc(100% - 4px) 4px, 100% 4px, 
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
                calc(100% - 4px) 100%, 4px 100%, 
                4px calc(100% - 4px), 0 calc(100% - 4px),
                0 4px, 4px 4px
            );
            pointer-events: none;
        }

        #chatbox.dragging {
            cursor: grabbing;
        }

        #gesture-btn {
            position: absolute;
            right: 44px; /* left of reset */
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            color: #fff;
            opacity: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #gesture-btn svg {
            width: 20px;
            height: 20px;
        }

        #reset-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            color: #fff;
            opacity: 1; /* Always fully visible */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #reset-btn svg {
            width: 20px;
            height: 20px;
        }

        .chat-header {
            padding: 24px 16px;
            border-bottom: 3px solid #fff;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: none;
            color: #fff;
            display: flex;
            align-items: center;
            user-select: none;
            position: relative;
        }

        .chat-header span:first-child {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .chat-header span:last-child {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 0.06em;
            font-weight: normal;
            font-family: 'VT323', monospace;
        }

        #chat-log {
            max-height: 60vh;
            padding: 14px 16px 20px 16px;
            overflow-y: auto;
            font-size: 14px;
            scrollbar-width: thin;
            scrollbar-color: #fff transparent;
            image-rendering: pixelated;
        }

        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
        }

        .chat-line {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
            align-items: flex-start;
            line-height: 1.2;
            font-family: 'VT323', monospace;
            font-size: 18px;
        }
            letter-spacing: 0;
        }

        .chat-line:last-child {
            margin-bottom: 0;
        }

        .chat-line .prompt-symbol {
            color: #fff;
            flex-shrink: 0;
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .chat-line.user .prompt-symbol,
        .chat-line.system .prompt-symbol {
            color: #fff;
        }

        .chat-line .line-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-line.thinking .line-text {
            color: #fff;
        }

        #prompt-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px 10px 16px;
            background: #000;
            margin-top: -4px;
            font-size: 18px;
            line-height: 1.2;
            font-family: 'VT323', monospace;
        }
            letter-spacing: 0;
        }

        #prompt-row .prompt-symbol {
            color: #fff;
            font-weight: normal;
            line-height: 1.2;
            font-size: 18px;
            letter-spacing: 0;
        }

        #prompt-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background: transparent;
            border: none;
            outline: none;
            caret-color: transparent;
            font: inherit;
            padding: 0;
            margin: 0;
            z-index: 10;
        }

        #prompt-display {
            flex: 1;
            white-space: pre;
            overflow: hidden;
            pointer-events: none;
            font: inherit;
            color: #fff;
            display: flex;
            align-items: center;
            min-height: 1.2em;
        }

        .retro-caret {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #fff;
            animation: blink 1s step-end infinite;
            vertical-align: -2px;
        }

        #prompt-row:not(:focus-within) .retro-caret {
            animation: none;
            opacity: 0.5; /* Dim or hide when not focused? */
            background-color: transparent;
            border: 1px solid #fff; /* Hollow block when inactive */
            color: #fff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #prompt-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        #prompt-input:disabled {
            color: rgba(255, 255, 255, 0.35);
        }

        #citation-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #fff;
            padding: 10px;
            border-radius: 4px;
            max-width: 320px;
            font-size: 12px;
            color: #ddd;
            display: none;
            z-index: 100;
            pointer-events: none;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
        }

        .citation-ref {
            color: #00ff8a;
            cursor: pointer;
            font-weight: normal;
        }
        .citation-ref:hover { text-decoration: underline; }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 200;
            color: #00ff8a;
            letter-spacing: 0.1em;
            font-family: 'VT323', monospace;
            font-size: 14px;
            letter-spacing: 0.04em;
            image-rendering: pixelated;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 138, 0.2);
            border-top-color: #00ff8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

        <div class="chat-header">
            <span>PHIL KNOWLEDGE SYSTEM</span>
            <button id="gesture-btn" title="Hand Gesture Control" aria-label="Hand Gesture Control">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

1h-1zM7 13h1v1h-1zM18 13h1v1h-1zM12 9h1v1h-1zM14 6h1v1h-1zM17 8h1v1h-1zM8 5h1v1h-1zM9 4h1v1h-1zM17 17h1v1h-1zM8 14h1v1h-1zM10 11h1v1h-1zM9 13h1v1h-1zM11 10h1v1h-1zM11 19h1v1h-1zM13 13h1v1h-1zM15 10h1v1h-1zM18 6h1v1h-1zM12 2h1v1h-1zM6 16h1v1h-1zM7 15h1v1h-1zM18 15h1v1h-1zM12 11h1v1h-1zM17 10h1v1h-1zM8 7h1v1h-1zM9 6h1v1h-1zM11 3h1v1h-1zM14 20h1v1h-1zM8 16h1v1h-1zM10 13h1v1h-1zM9 15h1v1h-1zM11 12h1v1h-1zM11 21h1v1h-1zM13 15h1v1h-1zM15 12h1v1h-1zM16 11h1v1h-1zM18 8h1v1h-1z" fill="#fff"/>
                </svg>
            </button>
            <button id="reset-btn" title="Reset Session" aria-label="Reset">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2h-2v2h2v2H4v2H2v5h2V8h12v2h-2v2h2v-2h2V8h2V6h-2V4h-2V2zM6 20h2v2h2v-2H8v-2h12v-2h2v-5h-2v5H8v-2h2v-2H8v2H6v2H4v2h2v2z" fill="#fff"/>

        </div>
        <div id="chat-log" aria-live="polite"></div>
        <div id="prompt-row">
            <span class="prompt-symbol">&gt;</span>
            <div style="position: relative; flex: 1; display: flex; align-items: center; overflow: hidden;">

    <div id="citation-tooltip"></div>

    <script src="//cdn.jsdelivr.net/npm/force-graph"></script>
    <script>
    (function() {
        'use strict';

        const API_BASE = 'http://localhost:8000';
        let Graph;
        let graphData = { nodes: [], links: [] };
        let nodesById = {};
        const allKnownNodes = new Map();
        const highlightNodes = new Set();
        const traversalNodes = new Set();
        const traversalLinks = new Set();
        let citationData = [];
        let citationHoverSeq = 0;
        let chatboxRect = null;

        const chatbox = document.getElementById('chatbox');
        const chatLog = document.getElementById('chat-log');
        const promptInput = document.getElementById('prompt-input');
        const promptDisplay = document.getElementById('prompt-display');
        const promptRow = document.getElementById('prompt-row');

        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
        const htmlEscapes = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

        function escapeHtml(str = '') {
            return String(str).replace(/[&<>"']/g, ch => htmlEscapes[ch]);
        }

        function formatText(str = '') {
            return escapeHtml(str).replace(/(?:\r\n|\r|\n)/g, '<br>');
        }

        function setLineContent(el, text, { trusted = false } = {}) {
            el.innerHTML = trusted ? text : formatText(text);
        }

        function appendLine(role, text = '', options = {}) {
            const line = document.createElement('div');
            line.className = `chat-line ${role}`;
            const prompt = document.createElement('span');
            prompt.className = 'prompt-symbol';
            prompt.textContent = '>';
            const textEl = document.createElement('span');
            textEl.className = 'line-text';
            if (text) setLineContent(textEl, text, options);
            line.appendChild(prompt);
            line.appendChild(textEl);
            chatLog.appendChild(line);
            chatLog.scrollTop = chatLog.scrollHeight;
            return {
                line,
                textEl,
                setContent: (value, opts = {}) => setLineContent(textEl, value, opts)
            };
        }

        function startThinkingLine() {
            const frames = ['.', '..', '...'];
            let idx = 0;
            const { line, setContent } = appendLine('ai', frames[0]);
            line.classList.add('thinking');
            const interval = setInterval(() => {
                idx = (idx + 1) % frames.length;
                setContent(frames[idx]);
            }, 320);
            return {
                complete(finalText, opts = {}) {
                    clearInterval(interval);
                    line.classList.remove('thinking');
                    if (finalText !== undefined) {
                        setContent(finalText || '', opts);
                    }
                }
            };
        }

        function sanitizeAnswer(text, citations) {
            if (!text) return '';

            // Map chunk_id -> index for cases where the model returns [[chunk_id]] or [chunk_id]
            const chunkIdToIndex = new Map();
            (citations || []).forEach(c => {
                if (c && c.chunk_id != null) {
                    chunkIdToIndex.set(String(c.chunk_id), c.index);
                }
            });

            const cite = (num) => {
                const c = citations.find(cit => cit.index === parseInt(num, 10));
                // Use HTML entities for [ ] to avoid regex double-wrapping.
                return c
                    ? `<span class="citation-ref" data-index="${num}">&#91;${num}&#93;</span>`
                    : `[${num}]`;
            };

            let out = text;

            // Replace [[chunk_id]] or [chunk_id] with numeric citations if we have a mapping
            out = out.replace(/\[\[([^\]]+)\]\]|\[([^\]]+)\]/g, (match, g1, g2) => {
                const id = g1 || g2;
                if (!id) return match;
                const idx = chunkIdToIndex.get(id.trim());
                return idx ? cite(idx) : match;
            });

            // Handle grouped citations like [2, 3, 4]
            out = out.replace(/\[(\d+(?:\s*,\s*\d+)+)\]/g, (_match, nums) => {
                return String(nums)
                    .split(/\s*,\s*/)
                    .map(n => cite(n))
                    .join(', ');
            });

            // Handle single citations like [1]
            out = out.replace(/\[(\d+)\]/g, (_match, num) => cite(num));

            return out;
        }

        function updatePromptDisplay() {
            const val = promptInput.value;
            const start = promptInput.selectionStart;
            const end = promptInput.selectionEnd;
            
            // Handle simple case: insertion caret
            let html = '';
            if (start === end) {
                const before = val.substring(0, start);
                const after = val.substring(start);
                html = escapeHtml(before) + '<span class="retro-caret"></span>' + escapeHtml(after);
            } else {
                // Selection range (optional: could highlight background)
                const before = val.substring(0, start);
                const sel = val.substring(start, end);
                const after = val.substring(end);
                html = escapeHtml(before) + `<span style="background:#fff;color:#000">${escapeHtml(sel)}</span>` + escapeHtml(after);
            }
            promptDisplay.innerHTML = html;
            
            // Sync scroll
            promptDisplay.scrollLeft = promptInput.scrollLeft;
        }

        function focusPrompt() {
            promptInput.focus({ preventScroll: true });
        }

        function setPromptVisible(visible) {
            if (visible) {
                promptRow.style.display = 'flex';
            } else {
                promptRow.style.display = 'none';
            }
        }

        function enablePrompt() {
            promptInput.disabled = false;
            promptInput.placeholder = '';
            setPromptVisible(true);
            focusPrompt();
            updatePromptDisplay();
            document.body.classList.remove('waiting');
        }

        function disablePrompt() {
            promptInput.disabled = true;
            setPromptVisible(false);
            document.body.classList.add('waiting');
        }

        function bootSequence() {
            disablePrompt();
            const thinker = startThinkingLine();
            fetch(`${API_BASE}/api/agent/greeting`)
                .then(res => res.ok ? res.json() : Promise.reject(new Error('greeting failed')))
                .then(data => {
                    thinker.complete(data.greeting || 'Phil ready—ask me about thinkers or concepts.');
                })
                .catch(() => {
                    thinker.complete('Phil ready—ask me about thinkers or concepts.');
                })
                .finally(() => {
                    enablePrompt();
                });
        }

        function handlePromptSubmit(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                runQuery();
            }
        }

        function resetSystem() {
            chatLog.innerHTML = '';
            traversalNodes.clear();
            traversalLinks.clear();
            highlightNodes.clear();
            citationData = [];
            resetGraphToBase();
            
            // Call backend reset
            fetch(`${API_BASE}/api/agent/reset`, { method: 'POST' })
                .then(() => bootSequence())
                .catch(err => {
                    console.error('Reset failed', err);
                    bootSequence();
                });
        }

        const gestureBtn = document.getElementById('gesture-btn');
        if (gestureBtn) {
            gestureBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // Placeholder: gesture control wiring comes later
                console.log('Hand gesture control: TODO');
            });
        }

        document.getElementById('reset-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent drag start if clicking button
            resetSystem();
        });

        async function runQuery() {
            const question = promptInput.value.trim();
            if (!question) return;

            appendLine('user', question);
            promptInput.value = '';
            disablePrompt();

            const tooltip = document.getElementById('citation-tooltip');
            if (tooltip) tooltip.style.display = 'none';
            // defer graph reset until we know if it's a follow-up

            const thinker = startThinkingLine();

            try {
                const res = await fetch(`${API_BASE}/api/agent/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, max_iterations: 25, verbose: false, require_traversal: true, min_hops: 1 })
                });

                if (!res.ok) throw new Error('Query failed');

                const data = await res.json();

                // If not continuing session, reset graph
                if (!data.session_continued) {
                    traversalNodes.clear();
                    traversalLinks.clear();
                    highlightNodes.clear();
                    resetGraphToBase();
                }

                citationData = data.citations || [];
                processTraversal(data);

                const formattedAnswer = sanitizeAnswer(data.answer, citationData) || '...';
                thinker.complete(formattedAnswer, { trusted: true });
                setupCitationHover();

                // if (traversalNodes.size > 0) {
                //     const edgeCount = Array.isArray(data.traversal?.edges) ? data.traversal.edges.length : traversalLinks.size;
                //     const suffix = edgeCount > 0 ? ` // ${edgeCount} edges` : '';
                //     appendLine('system', `Traversal ${traversalNodes.size} nodes${suffix}`);
                // }
            } catch (err) {
                thinker.complete(`Error: ${err.message}`);
            } finally {
                enablePrompt();
            }
        }

        function processTraversal(data) {
            if (!data) return;

            if (data.traversal && Array.isArray(data.traversal.edges)) {
                data.traversal.edges.forEach(edge => {
                    const srcId = edge.source;
                    const tgtId = edge.target;
                    if (!srcId || !tgtId) return;
                    traversalLinks.add(`${srcId}-${tgtId}`);
                    traversalNodes.add(srcId);
                    traversalNodes.add(tgtId);

                    const exists = graphData.links.some(l =>
                        (l.source === srcId && l.target === tgtId) ||
                        (l.source === tgtId && l.target === srcId)
                    );
                    if (!exists) {
                        graphData.links.push({ source: srcId, target: tgtId, label: edge.label || edge.type || '', _dynamic: true, isBase: false });
                    }

                    ensureNode(srcId);
                    ensureNode(tgtId);
                });
            }

            if (Array.isArray(data.collected_entities)) {
                data.collected_entities.forEach(id => {
                    ensureNode(id);
                    traversalNodes.add(id);
                });
            }

            // Ensure citation source nodes exist so hover can focus them
            if (Array.isArray(citationData)) {
                citationData.forEach(c => {
                    if (c && Array.isArray(c.node_ids)) {
                        c.node_ids.forEach(id => {
                            ensureNode(id);
                            traversalNodes.add(id);
                        });
                    }
                });
            }

            graphData.nodes.forEach(n => { n.neighbors = n.neighbors || []; });
            graphData.links.forEach(link => {
                const src = typeof link.source === 'object' ? link.source : nodesById[link.source];
                const tgt = typeof link.target === 'object' ? link.target : nodesById[link.target];
                if (src && tgt) {
                    if (!src.neighbors.includes(tgt)) src.neighbors.push(tgt);
                    if (!tgt.neighbors.includes(src)) tgt.neighbors.push(src);
                }
            });

            Graph.graphData({
                nodes: graphData.nodes,
                links: graphData.links
            });
            Graph.nodeCanvasObject(Graph.nodeCanvasObject());
        }

        function ensureNode(id) {
            if (!id || nodesById[id]) return;
            const cached = allKnownNodes.get(id);
            const newNode = cached
                ? { ...cached, neighbors: (cached.neighbors || []).slice(), val: cached.val || 5, _dynamic: true, isBase: false }
                : { id, label: id, val: 1, neighbors: [], _dynamic: true, isBase: false };
            graphData.nodes.push(newNode);
            nodesById[id] = newNode;
        }

        function resetGraphToBase() {
            if (!Graph || !graphData || !Array.isArray(graphData.nodes) || !Array.isArray(graphData.links)) return;

            const baseNodes = graphData.nodes.filter(n => n && n.isBase);
            const baseNodeIds = new Set(baseNodes.map(n => n.id));

            const baseLinks = graphData.links.filter(l => {
                if (!l || !l.isBase) return false;
                const s = typeof l.source === 'object' ? l.source.id : l.source;
                const t = typeof l.target === 'object' ? l.target.id : l.target;
                return baseNodeIds.has(s) && baseNodeIds.has(t);
            });

            graphData = { nodes: baseNodes, links: baseLinks };
            nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

            graphData.nodes.forEach(n => { n.neighbors = []; });
            graphData.links.forEach(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                const src = nodesById[s];
                const tgt = nodesById[t];
                if (src && tgt) {
                    src.neighbors.push(tgt);
                    tgt.neighbors.push(src);
                }
            });

            Graph.graphData(graphData);
            Graph.nodeCanvasObject(Graph.nodeCanvasObject());
        }

        function setupCitationHover() {
            const tooltip = document.getElementById('citation-tooltip');
            const graphContainer = document.getElementById('graph-container');
            const getCanvasRect = () => {
                const canvas = graphContainer.querySelector('canvas');
                return canvas ? canvas.getBoundingClientRect() : graphContainer.getBoundingClientRect();
            };

            function getNodeScreenPosition(nodeId) {
                const node = nodesById[nodeId];
                if (!node || !Graph) return null;
                const coords = Graph.graph2ScreenCoords(node.x, node.y);
                if (!coords) return null;
                const rect = getCanvasRect();
                return { x: rect.left + coords.x, y: rect.top + coords.y };
            }

            function showTooltip(content, targetPos) {
                const safeContent = content || 'Source';
                tooltip.innerHTML = formatText(safeContent);
                tooltip.style.display = 'block';
                const tipRect = tooltip.getBoundingClientRect();

                // Offset to the right of the node and slightly above center
                const offsetX = 14;
                const offsetY = -tipRect.height * 0.25;

                let posX = targetPos.x + offsetX;
                let posY = targetPos.y + offsetY;

                // Clamp inside viewport with 10px padding
                posX = Math.min(window.innerWidth - tipRect.width - 10, Math.max(10, posX));
                posY = Math.min(window.innerHeight - tipRect.height - 10, Math.max(10, posY));

                tooltip.style.left = `${posX}px`;
                tooltip.style.top = `${posY}px`;
            }

            function trackTooltipToNode(seq, content, nodeIds, attempt = 0) {
                if (seq !== citationHoverSeq) return;
                if (!Array.isArray(nodeIds) || !nodeIds.length || attempt > 180) return;
                const nodePosition = nodeIds.map(getNodeScreenPosition).find(Boolean);
                if (nodePosition) {
                    showTooltip(content, nodePosition);
                }
                requestAnimationFrame(() => trackTooltipToNode(seq, content, nodeIds, attempt + 1));
            }

            function focusNodeView(seq, nodeIds, attempt = 0) {
                if (seq !== citationHoverSeq) return;
                if (!Graph || !Array.isArray(nodeIds) || !nodeIds.length || attempt > 180) return;
                const node = nodeIds
                    .map(id => nodesById[id])
                    .find(n => n && Number.isFinite(n.x) && Number.isFinite(n.y));
                if (!node) {
                    requestAnimationFrame(() => focusNodeView(seq, nodeIds, attempt + 1));
                    return;
                }
                Graph.centerAt(node.x, node.y, 600);
                Graph.zoom(4, 600);
            }

            document.querySelectorAll('.citation-ref').forEach(el => {
                el.onmouseenter = e => {
                    const idx = parseInt(el.dataset.index, 10);
                    const c = citationData.find(cit => cit.index === idx);
                    if (!c) return;

                    const content = c.full_content || c.preview || '';
                    const nodeIds = Array.isArray(c.node_ids) ? c.node_ids : [];

                    // start a new hover session (cancels any in-flight tracking)
                    citationHoverSeq += 1;
                    const seq = citationHoverSeq;

                    const nodePosition = nodeIds.map(getNodeScreenPosition).find(Boolean);
                    const targetPos = nodePosition || { x: e.clientX, y: e.clientY };
                    showTooltip(content, targetPos);

                    // Keep the tooltip pinned to the node while the camera animates
                    trackTooltipToNode(seq, content, nodeIds);

                    if (nodeIds.length) {
                        highlightNodes.clear();
                        nodeIds.forEach(nid => highlightNodes.add(nid));
                        Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                        focusNodeView(seq, nodeIds);
                    }
                };

                el.onmouseleave = () => {
                    citationHoverSeq += 1;
                    tooltip.style.display = 'none';
                    highlightNodes.clear();
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                };
            });
        }

        function initGraph() {
            const container = document.getElementById('graph-container');

            Graph = ForceGraph()(container)
                .backgroundColor('#000000')
                .width(window.innerWidth)
                .height(window.innerHeight)
                .nodeCanvasObject((node, ctx, globalScale) => {
                    ctx.globalAlpha = 1.0;
                    ctx.imageSmoothingEnabled = false;
                    const pixelSize = 2; 
                    const snap = v => Math.round(v / pixelSize) * pixelSize;
                    const x = snap(node.x);
                    const y = snap(node.y);

                    // Radius based on value
                    const rRaw = Math.max(8, 8 + Math.sqrt(node.val || 0));
                    const r = Math.round(rRaw / pixelSize) * pixelSize;
                    
                    const label = node.label || node.id;
                    const baseFont = Math.max(9, Math.min(18, r * 2.5));
                    const fontSize = baseFont / globalScale;
                    ctx.font = `${fontSize}px "VT323", monospace`;

                    const isActive = highlightNodes.has(node.id) || traversalNodes.has(node.id);
                    const strokeColor = isActive ? '#00ff8a' : '#ffffff';

                    // Octagon Logic: intersection of box and rotated box (sum of abs)
                    // box: max(|dx|, |dy|) <= r
                    // diamond: |dx| + |dy| <= r * 1.4
                    const limit = r * 1.4;
                    const innerR = Math.max(0, r - pixelSize); 
                    const innerLimit = innerR * 1.4;

                    // Solid fill to ensure opacity (prevents sub-pixel translucency artifacts)
                    ctx.fillStyle = '#000000';
                    if (innerR > 0) {
                        const A = innerR;
                        const B = Math.max(0, innerLimit - innerR);
                        ctx.beginPath();
                        ctx.moveTo(x + A, y + B);
                        ctx.lineTo(x + B, y + A);
                        ctx.lineTo(x - B, y + A);
                        ctx.lineTo(x - A, y + B);
                        ctx.lineTo(x - A, y - B);
                        ctx.lineTo(x - B, y - A);
                        ctx.lineTo(x + B, y - A);
                        ctx.lineTo(x + A, y - B);
                        ctx.closePath();
                        ctx.fill();
                    }

                    for (let ix = -r; ix <= r; ix += pixelSize) {
                        for (let iy = -r; iy <= r; iy += pixelSize) {
                            const adx = Math.abs(ix);
                            const ady = Math.abs(iy);
                            const sum = adx + ady;

                            if (sum <= limit) {
                                // It's inside the outer octagon
                                if (adx <= innerR && ady <= innerR && sum <= innerLimit) {
                                    // Inside inner octagon -> Fill Black
                                    ctx.fillStyle = '#000';
                                    ctx.fillRect(x + ix, y + iy, pixelSize, pixelSize);
                                } else {
                                    // Border -> Fill White/Green
                                    ctx.fillStyle = strokeColor;
                                    ctx.fillRect(x + ix, y + iy, pixelSize, pixelSize);
                                }
                            }
                        }
                    }

                    if (globalScale > 0.8 || isActive || node.val > 10) {
                        ctx.fillStyle = isActive ? '#00ff8a' : '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, x, y);
                    }
                })
                .linkCanvasObject((link, ctx, globalScale) => {
                    ctx.imageSmoothingEnabled = false;
                    ctx.lineCap = 'square';
                    ctx.lineJoin = 'miter';
                    const snap = v => Math.round(v);
                    const start = link.source;
                    const end = link.target;
                    if (typeof start !== 'object' || typeof end !== 'object') return;

                    const curvature = 0.2;
                    const sx = snap(start.x);
                    const sy = snap(start.y);
                    const ex = snap(end.x);
                    const ey = snap(end.y);
                    const dx = ex - sx;
                    const dy = ey - sy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist === 0) return;
                    const midX = (sx + ex) / 2;
                    const midY = (sy + ey) / 2;
                    const nx = -dy / dist;
                    const ny = dx / dist;
                    const cpX = snap(midX + nx * dist * curvature);
                    const cpY = snap(midY + ny * dist * curvature);

                    const isTraversal = traversalLinks.has(`${start.id}-${end.id}`) || traversalLinks.has(`${end.id}-${start.id}`);
                    const isHighlight = highlightNodes.has(start.id) && highlightNodes.has(end.id);
                    const isActive = isTraversal || isHighlight;

                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo(cpX, cpY, ex, ey);
                    ctx.strokeStyle = isActive ? '#00ff8a' : 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = (isActive ? 2 : 0.5) / globalScale;
                    ctx.stroke();

                    const label = link.label || link.type;
                    if (label && (globalScale > 1.2 || isActive)) {
                        const t = 0.5;
                        const bx = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * cpX + t * t * ex;
                        const by = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * cpY + t * t * ey;
                        const angle = Math.atan2(dy, dx);

                        ctx.save();
                        ctx.translate(bx, by);
                        ctx.rotate(angle);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = isActive ? '#00ff8a' : '#ffffff';
                        // Scale label with graph (fixed graph units) so it grows when zooming in
                        const fontSize = 3;
                        ctx.font = `${fontSize}px "VT323", monospace`;
                        ctx.fillText(label, 0, -3);
                        ctx.restore();
                    }
                })
                .onNodeClick(node => {
                    highlightNodes.clear();
                    if (node) {
                        highlightNodes.add(node.id);
                        if (Array.isArray(node.neighbors)) {
                            node.neighbors.forEach(n => highlightNodes.add(n.id));
                        }
                    }
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                })
                .onBackgroundClick(() => {
                    highlightNodes.clear();
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                });

            Graph.d3Force('charge').strength(-120);
            Graph.d3Force('link').distance(120);
            Graph.onEngineTick(() => repelGraphFromChatbox());
        }

        async function loadGraph() {
            try {
                const res = await fetch(`${API_BASE}/api/graph?limit=5000`);
                if (!res.ok) throw new Error('Failed to load graph');
                const rawData = await res.json();

                const allNodes = new Map();
                rawData.nodes.forEach(n => {
                    allNodes.set(n.id, n);
                    allKnownNodes.set(n.id, n);
                });

                const adj = new Map();
                rawData.nodes.forEach(n => adj.set(n.id, []));
                const validLinks = rawData.links.filter(l => allNodes.has(l.source) && allNodes.has(l.target));

                validLinks.forEach(link => {
                    adj.get(link.source).push(link.target);
                    adj.get(link.target).push(link.source);
                });

                const visited = new Set();
                const components = [];

                for (const nodeId of allNodes.keys()) {
                    if (!visited.has(nodeId)) {
                        const component = [];
                        const queue = [nodeId];
                        visited.add(nodeId);

                        while (queue.length > 0) {
                            const current = queue.shift();
                            component.push(current);
                            const neighbors = adj.get(current) || [];
                            neighbors.forEach(next => {
                                if (!visited.has(next)) {
                                    visited.add(next);
                                    queue.push(next);
                                }
                            });
                        }
                        components.push(component);
                    }
                }

                if (components.length === 0) return;

                const largestComponentIds = new Set(components.reduce((a, b) => (a.length > b.length ? a : b)));
                const mainNodes = rawData.nodes.filter(n => largestComponentIds.has(n.id));
                const mainLinks = validLinks.filter(l => largestComponentIds.has(l.source) && largestComponentIds.has(l.target));

                const nodeDegrees = new Map();
                mainNodes.forEach(n => nodeDegrees.set(n.id, 0));
                mainLinks.forEach(l => {
                    nodeDegrees.set(l.source, (nodeDegrees.get(l.source) || 0) + 1);
                    nodeDegrees.set(l.target, (nodeDegrees.get(l.target) || 0) + 1);
                });

                const nodesByCommunity = {};
                mainNodes.forEach(n => {
                    const comm = n.community || 'unknown';
                    if (!nodesByCommunity[comm]) nodesByCommunity[comm] = [];
                    n.val = nodeDegrees.get(n.id);
                    nodesByCommunity[comm].push(n);
                });

                const finalNodes = [];
                Object.values(nodesByCommunity).forEach(commNodes => {
                    commNodes.sort((a, b) => b.val - a.val);
                    if (commNodes[0]) finalNodes.push(commNodes[0]);
                });

                const finalNodeIds = new Set(finalNodes.map(n => n.id));
                const finalLinks = mainLinks.filter(l => finalNodeIds.has(l.source) && finalNodeIds.has(l.target));

                const linkedNodeIds = new Set();
                finalLinks.forEach(link => {
                    linkedNodeIds.add(link.source);
                    linkedNodeIds.add(link.target);
                });
                const connectedFinalNodes = finalNodes.filter(node => linkedNodeIds.has(node.id));
                const connectedNodeIds = new Set(connectedFinalNodes.map(n => n.id));
                const connectedFinalLinks = finalLinks.filter(link => connectedNodeIds.has(link.source) && connectedNodeIds.has(link.target));

                graphData = { nodes: connectedFinalNodes, links: connectedFinalLinks };

                // Mark this as the base (initial) graph state so we can reset between queries
                graphData.nodes.forEach(n => { n.isBase = true; });
                graphData.links.forEach(l => { l.isBase = true; });

                nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

                graphData.nodes.forEach(n => { n.neighbors = []; });
                graphData.links.forEach(link => {
                    const src = nodesById[link.source];
                    const tgt = nodesById[link.target];
                    if (src && tgt) {
                        src.neighbors.push(tgt);
                        tgt.neighbors.push(src);
                    }
                });

                Graph.graphData(graphData);
                document.getElementById('loading').style.display = 'none';
                bootSequence();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-text').innerText = 'Error: ' + err.message;
            }
        }

        function updateChatboxRect() {
            chatboxRect = chatbox.getBoundingClientRect();
        }

        function repelGraphFromChatbox() {
            if (!Graph || !chatboxRect) return;

            const tl = Graph.screen2GraphCoords(chatboxRect.left, chatboxRect.top);
            const br = Graph.screen2GraphCoords(chatboxRect.right, chatboxRect.bottom);
            if (!tl || !br) return;

            const minX = Math.min(tl.x, br.x);
            const maxX = Math.max(tl.x, br.x);
            const minY = Math.min(tl.y, br.y);
            const maxY = Math.max(tl.y, br.y);

            const midX = (minX + maxX) / 2;
            const midY = (minY + maxY) / 2;
            const halfW = (maxX - minX) / 2;
            const halfH = (maxY - minY) / 2;

            const k = Graph.zoom(); 
            const pad = 25 / k; // Padding in graph units

            graphData.nodes.forEach(node => {
                const dx = node.x - midX;
                const dy = node.y - midY;
                const adx = Math.abs(dx);
                const ady = Math.abs(dy);

                const overlapX = (halfW + pad) - adx;
                const overlapY = (halfH + pad) - ady;

                if (overlapX > 0 && overlapY > 0) {
                    // Push out along shortest axis
                    const strength = 2.0;
                    if (overlapX < overlapY) {
                        const sign = dx > 0 ? 1 : -1;
                        node.vx += sign * strength;
                        node.x += sign * (strength * 0.1); 
                    } else {
                        const sign = dy > 0 ? 1 : -1;
                        node.vy += sign * strength;
                        node.y += sign * (strength * 0.1);
                    }
                }
            });
        }

        function enableDragging() {
            const dragHandle = chatbox;
            let pointerId = null;
            let offsetX = 0;
            let offsetY = 0;

            const onPointerMove = e => {
                if (pointerId === null || e.pointerId !== pointerId) return;
                const nextLeft = clamp(e.clientX - offsetX, 10, window.innerWidth - chatbox.offsetWidth - 10);
                const nextTop = clamp(e.clientY - offsetY, 10, window.innerHeight - chatbox.offsetHeight - 10);
                chatbox.style.left = `${nextLeft}px`;
                chatbox.style.top = `${nextTop}px`;
                updateChatboxRect();
            };

            const endDrag = e => {
                if (pointerId === null || (e && e.pointerId !== pointerId)) return;
                dragHandle.releasePointerCapture(pointerId);
                pointerId = null;
                chatbox.classList.remove('dragging');
                updateChatboxRect();
                if (Graph) Graph.d3AlphaTarget(0); // Cooldown
            };

            dragHandle.addEventListener('pointerdown', e => {
                // Allow dragging from header or the box border/background itself, 
                // but NOT from text selection areas or inputs
                const target = e.target;
                const isInput = target.tagName === 'INPUT' || target.closest('input');
                const isLog = target.closest('#chat-log');
                const isLink = target.closest('a') || target.closest('button') || target.closest('.citation-ref');
                
                // If clicking log, input, interactive elements, or the reset button, don't drag
                if (isInput || isLog || isLink || target.closest('#reset-btn')) return;

                pointerId = e.pointerId;
                const rect = chatbox.getBoundingClientRect();
                offsetX = e.clientX - rect.left; // relative to box
                offsetY = e.clientY - rect.top;
                
                chatbox.classList.add('dragging');
                dragHandle.setPointerCapture(pointerId);
                if (Graph) Graph.d3AlphaTarget(0.3).restart(); // Wake up
            });

            dragHandle.addEventListener('pointermove', onPointerMove);
            dragHandle.addEventListener('pointerup', endDrag);
            dragHandle.addEventListener('pointercancel', endDrag);
            dragHandle.addEventListener('pointerleave', endDrag);

            new ResizeObserver(() => updateChatboxRect()).observe(chatbox);
        }

        promptInput.addEventListener('keydown', handlePromptSubmit);
        // Sync display on input interactions
        ['input', 'keydown', 'keyup', 'click', 'select', 'focus', 'blur'].forEach(evt => {
            promptInput.addEventListener(evt, () => requestAnimationFrame(updatePromptDisplay));
        });

        window.addEventListener('resize', () => {
            if (!chatboxRect) return;
            chatbox.style.left = `${clamp(chatbox.offsetLeft, 10, window.innerWidth - chatbox.offsetWidth - 10)}px`;
            chatbox.style.top = `${clamp(chatbox.offsetTop, 10, window.innerHeight - chatbox.offsetHeight - 10)}px`;
            if (Graph) Graph.width(window.innerWidth).height(window.innerHeight);
            updateChatboxRect();
        });

        chatbox.addEventListener('click', () => focusPrompt());
        window.addEventListener('keydown', e => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (promptInput.disabled) return;
            if (document.activeElement !== promptInput) focusPrompt();
        });

        enableDragging();
        try {
            updateChatboxRect();
            initGraph();
            loadGraph();
        } catch (err) {
            console.error(err);
            document.getElementById('loading-text').innerText = 'System Error: ' + err.message;
        }
    })();
    </script>
</body>
