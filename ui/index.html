        document.getElementById('reset-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent drag start if clicking button
            resetSystem();
        });

        async function runQuery() {
            const question = promptInput.value.trim();
            if (!question) return;

            appendLine('user', question);
            promptInput.value = '';
            disablePrompt();

            const tooltip = document.getElementById('citation-tooltip');
            if (tooltip) tooltip.style.display = 'none';
            // defer graph reset until we know if it's a follow-up

            const thinker = startThinkingLine();
            let ws = null;
            let finished = false;
            let sessionInfoReceived = false;

            const resetForNewSession = () => {
                traversalNodes.clear();
                traversalLinks.clear();
                highlightNodes.clear();
                resetGraphToBase();
            };

            const finishError = (msg) => {
                if (finished) return;
                finished = true;
                thinker.complete(`Error: ${msg || 'Unknown error'}`);
                enablePrompt();
            };

            const finishAnswer = (data) => {
                if (finished) return;
                finished = true;

                const localCitations = data.citations || [];
                citationData = localCitations;
                const answerId = ++citationAnswerSeq;
                if (localCitations.length) {
                    localCitations.forEach(c => {
                        if (c && c.index != null) {
                            citationStore.set(`${answerId}:${c.index}`, c);
                        }
                    });
                }

                if (data.traversal || data.traversal_nodes || data.collected_entities) {
                    processTraversal(data);
                }

                const formattedAnswer = sanitizeAnswer(data.answer, localCitations, { answerId }) || '...';
                thinker.complete(formattedAnswer, { trusted: true });
                setupCitationHover();
                enablePrompt();
            };

            try {
                ws = new WebSocket(AGENT_WS_URL);
            } catch (err) {
                finishError(err.message);
                return;
            }

            ws.addEventListener('open', () => {
                ws.send(JSON.stringify({ question, max_iterations: 25 }));
            });

            ws.addEventListener('message', (event) => {
                let msg = null;
                try { msg = JSON.parse(event.data); } catch (_) {}
                if (!msg || !msg.type) return;

                if (msg.type === 'session') {
                    sessionInfoReceived = true;
                    if (!msg.session_continued) resetForNewSession();
                    return;
                }

                if (msg.type === 'entities') {
                    const entities = msg.entities || msg.collected_entities || [];
                    if (entities.length) processTraversal({ collected_entities: entities });
                    return;
                }

                if (msg.type === 'traversal') {
                    processTraversal(msg);
                    return;
                }

                if (msg.type === 'complete') {
                    if (!sessionInfoReceived && msg.session_continued === false) {
                        resetForNewSession();
                    }
                    finishAnswer(msg);
                    try { ws.close(); } catch (_) {}
                    return;
                }

                if (msg.type === 'error') {
                    finishError(msg.message);
                    try { ws.close(); } catch (_) {}
                }
            });

            ws.addEventListener('error', () => {
                finishError('WebSocket connection failed');
            });

            ws.addEventListener('close', () => {
                if (!finished) finishError('WebSocket closed');
            });
        }

        function processTraversal(data) {
            if (!data) return;

            // IMPORTANT: do not mutate the arrays currently owned by force-graph while the engine is ticking.
            // Build a fresh {nodes,links} snapshot, apply deltas, then hand off atomically via setGraphData().
            const next = {
                nodes: Array.isArray(graphData?.nodes) ? graphData.nodes.slice() : [],
                links: Array.isArray(graphData?.links) ? graphData.links.slice() : [],
            };

            const nextNodesById = new Map();
            for (const n of next.nodes) {
                if (!n || typeof n !== 'object') continue;
                if (n.id == null) continue;
                const id = String(n.id);
                if (!id) continue;
                nextNodesById.set(id, n);
            }

            const ensureNextNode = (rawId, meta = null) => {
                if (rawId == null) return null;
                const id = String(rawId);
                if (!id) return null;

                const existing = nextNodesById.get(id);
                if (existing) {
                    if (meta && typeof meta === 'object') Object.assign(existing, meta);
                    if (!existing.id) existing.id = id;
                    if (!existing.label) existing.label = existing.label || id;
                    return existing;
                }

                const cached = allKnownNodes.get(id);
                const base = (cached && typeof cached === 'object') ? cached : null;
                const node = base
                    ? { ...base, neighbors: (base.neighbors || []).slice(), val: base.val || 5, _dynamic: true, isBase: false }
                    : { id, label: id, val: 1, neighbors: [], _dynamic: true, isBase: false };

                if (meta && typeof meta === 'object') Object.assign(node, meta);
                node.id = id;
                if (!node.label) node.label = id;

                next.nodes.push(node);
                nextNodesById.set(id, node);
                return node;
            };

            // Upsert traversal node metadata
            if (Array.isArray(data.traversal_nodes)) {
                for (const n of data.traversal_nodes) {
                    if (!n || typeof n !== 'object' || n.id == null) continue;
                    const id = String(n.id);
                    if (!id) continue;
                    const normalized = { ...n, id, label: n.label || id };
                    const cached = allKnownNodes.get(id) || {};
                    allKnownNodes.set(id, { ...cached, ...normalized });
                    ensureNextNode(id, normalized);
                }
            }

            // Edges (de-dupe, ensure endpoints exist)
            if (data.traversal && Array.isArray(data.traversal.edges)) {
                // force-graph may mutate link endpoints from ids -> node objects; normalize for stable de-duping
                const linkEndpointId = (v) => (v && typeof v === 'object') ? v.id : v;

                for (const edge of data.traversal.edges) {
                    const srcRaw = edge?.source;
                    const tgtRaw = edge?.target;
                    if (srcRaw == null || tgtRaw == null) continue;

                    const srcId = String(srcRaw);
                    const tgtId = String(tgtRaw);
                    if (!srcId || !tgtId) continue;

                    traversalLinks.add(`${srcId}-${tgtId}`);
                    traversalNodes.add(srcId);
                    traversalNodes.add(tgtId);

                    const exists = next.links.some(l => {
                        if (!l || typeof l !== 'object') return false;
                        const s = linkEndpointId(l.source);
                        const t = linkEndpointId(l.target);
                        if (s == null || t == null) return false;
                        const sid = String(s);
                        const tid = String(t);
                        return (sid === srcId && tid === tgtId) || (sid === tgtId && tid === srcId);
                    });

                    if (!exists) {
                        next.links.push({ source: srcId, target: tgtId, label: edge.label || edge.type || '', _dynamic: true, isBase: false });
                    }

                    ensureNextNode(srcId);
                    ensureNextNode(tgtId);
                }
            }

            // Entities: cap to avoid graph explosion (only add up to MAX_EXTRA_ENTITY_NODES beyond traversal_nodes/edges)
            const MAX_EXTRA_ENTITY_NODES = 20;
            if (Array.isArray(data.collected_entities)) {
                let added = 0;
                for (const rawId of data.collected_entities) {
                    if (nextNodesById.has(String(rawId))) continue;
                    if (added >= MAX_EXTRA_ENTITY_NODES) break;
                    const node = ensureNextNode(rawId);
                    if (node) { traversalNodes.add(String(node.id)); added++; }
                }
            }

            // Ensure every cited node appears (no cap — user needs to see all cited evidence)
            if (Array.isArray(citationData)) {
                for (const c of citationData) {
                    if (!c || !Array.isArray(c.node_ids)) continue;
                    for (const rawId of c.node_ids) {
                        const node = ensureNextNode(rawId);
                        if (node) traversalNodes.add(String(node.id));
                    }
                }
            }

            placeNewNodesNearNeighbors(next);
            setGraphData(next, 'processTraversal');
            if (Graph && typeof Graph.d3ReheatSimulation === 'function') Graph.d3ReheatSimulation();
            if (Graph) Graph.nodeCanvasObject(Graph.nodeCanvasObject());
            scheduleZoomToFitLoadedGraph();
        }

        function placeNewNodesNearNeighbors(next) {
            const nodeMap = new Map(next.nodes.map(n => [String(n.id), n]));
            const getOther = (link, id) => {
                const s = link.source && typeof link.source === 'object' ? link.source.id : link.source;
                const t = link.target && typeof link.target === 'object' ? link.target.id : link.target;
                const sid = String(s), tid = String(t);
                return sid === id ? nodeMap.get(tid) : tid === id ? nodeMap.get(sid) : null;
            };
            const hasPos = (n) => n && typeof n.x === 'number' && typeof n.y === 'number';
            const placed = new Set();
            next.nodes.forEach(n => { if (hasPos(n)) placed.add(String(n.id)); });
            let changed = true;
            while (changed) {
                changed = false;
                next.nodes.forEach(n => {
                    const nid = String(n.id);
                    if (placed.has(nid)) return;
                    let sumX = 0, sumY = 0, count = 0;
                    next.links.forEach(link => {
                        const other = getOther(link, nid);
                        if (!other || !hasPos(other)) return;
                        sumX += other.x; sumY += other.y; count++;
                    });
                    if (count > 0) {
                        n.x = sumX / count + (Math.random() - 0.5) * 80;
                        n.y = sumY / count + (Math.random() - 0.5) * 80;
                        n.fx = n.x; n.fy = n.y;
                        placed.add(nid);
                        changed = true;
                    }
                });
            }
        }

        function setGraphData(data, from) {
            if (!data) return;

            const nodes = Array.isArray(data.nodes) ? data.nodes : [];
            const links = Array.isArray(data.links) ? data.links : [];
            const badNodes = nodes.filter(n => !n || typeof n !== 'object');
            if (badNodes.length > 0) {
                console.error(`[${from}] BAD DATA: found ${badNodes.length} non-object nodes. Normalizing graph data to prevent force-graph crashes.`, badNodes, data);
            }
            const normalized = normalizeGraphData({ nodes, links });

            // Final safety: coerce any lingering primitives into node objects and copy arrays to avoid mutating force-graph internals
            const safeNodes = [];
            const seenNodeIds = new Set();
            for (const n of normalized.nodes) {
                if (n && typeof n === 'object' && n.id != null) {
                    const id = String(n.id);
                    if (!id) continue;
                    if (seenNodeIds.has(id)) continue;
                    // Ensure stable id/label in case upstream produced non-string ids
                    n.id = id;
                    if (!n.label) n.label = id;
                    safeNodes.push(n);
                    seenNodeIds.add(id);
                } else if (n != null) {
                    const id = String(n);
                    if (id && !seenNodeIds.has(id)) {
                        safeNodes.push({ id, label: id, val: 1, neighbors: [], _dynamic: true, isBase: false });
                        seenNodeIds.add(id);
                    }
                }
            }

            const safeLinks = [];
            for (const l of normalized.links || []) {
                if (!l || typeof l !== 'object') continue;
                const s = typeof l.source === 'object' ? l.source?.id : l.source;
                const t = typeof l.target === 'object' ? l.target?.id : l.target;
                if (s == null || t == null) continue;
                const sid = String(s);
                const tid = String(t);
                if (!sid || !tid) continue;
                if (!seenNodeIds.has(sid)) {
                    safeNodes.push({ id: sid, label: sid, val: 1, neighbors: [], _dynamic: true, isBase: false });
                    seenNodeIds.add(sid);
                }
                if (!seenNodeIds.has(tid)) {
                    safeNodes.push({ id: tid, label: tid, val: 1, neighbors: [], _dynamic: true, isBase: false });
                    seenNodeIds.add(tid);
                }
                safeLinks.push({ ...l, source: sid, target: tid });
            }

            // Tripwire: never pass primitives/missing ids to force-graph (d3-force will assign vx/vy)
            const invalidNodes = safeNodes.filter(n => !n || typeof n !== 'object' || n.id == null || !String(n.id));
            if (invalidNodes.length) {
                console.error(`[${from}] REFUSING Graph.graphData(): ${invalidNodes.length} invalid node(s) after normalization.`, invalidNodes.slice(0, 10));
                console.trace(`[${from}] invalid node(s) trace`);
                return;
            }

            const invalidLinks = safeLinks.filter(l => !l || typeof l !== 'object' || l.source == null || l.target == null || !String(l.source) || !String(l.target));
            if (invalidLinks.length) {
                console.error(`[${from}] REFUSING Graph.graphData(): ${invalidLinks.length} invalid link(s) after normalization.`, invalidLinks.slice(0, 10));
                console.trace(`[${from}] invalid link(s) trace`);
                return;
            }

            // Hydrate link endpoints to node objects (force-graph/d3-force mutates endpoints anyway; this avoids any chance of string nodes leaking)
            const nodeById = new Map();
            safeNodes.forEach(n => { if (n && typeof n === 'object' && n.id != null) nodeById.set(String(n.id), n); });

            const hydratedLinks = [];
            const hydrationFailures = [];
            for (const l of safeLinks) {
                const src = nodeById.get(String(l.source));
                const tgt = nodeById.get(String(l.target));
                if (!src || !tgt) {
                    hydrationFailures.push(l);
                    continue;
                }
                hydratedLinks.push({ ...l, source: src, target: tgt });
            }
            if (hydrationFailures.length) {
                console.error(`[${from}] REFUSING Graph.graphData(): ${hydrationFailures.length} link(s) refer to missing nodes after hydration.`, hydrationFailures.slice(0, 10));
                console.trace(`[${from}] hydration failure trace`);
                return;
            }

            graphData = { nodes: safeNodes, links: hydratedLinks };
            nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

            graphData.nodes.forEach(n => { n.neighbors = []; });
            graphData.links.forEach(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                const src = nodesById[s];
                const tgt = nodesById[t];
                if (src && tgt) {
                    src.neighbors.push(tgt);
                    tgt.neighbors.push(src);
                }
            });

            // Expose for debugging
            window.graphDataDump = graphData;
            window.graphDataDumpStats = {
                from,
                nodes: graphData.nodes.length,
                links: graphData.links.length,
                nonObjectNodes: graphData.nodes.filter(n => !n || typeof n !== 'object').slice(0, 8),
            };

            try {
                // Final validation before handing to library
                if (graphData.nodes.some(n => typeof n !== 'object')) {
                    throw new Error("graphData.nodes contains primitives!");
                }
                Graph.graphData(graphData);

                // Capture what force-graph thinks it has, after it has had a chance to ingest.
                setTimeout(() => {
                    try { window.graphDataDumpInternal = Graph.graphData(); } catch (_) {}
                }, 0);
            } catch (err) {
                console.error(`[${from}] Graph.graphData crashed`, err);
            }
        }

        function scheduleZoomToFitLoadedGraph({ duration = 700, padding = 80, debounceMs = 180 } = {}) {
            if (!Graph || typeof Graph.centerAt !== 'function' || typeof Graph.zoom !== 'function') return;
            if (!graphData || !Array.isArray(graphData.nodes) || graphData.nodes.length === 0) return;

            if (autoFitTimer) {
                clearTimeout(autoFitTimer);
                autoFitTimer = null;
            }

            // Debounce so multiple expansions in quick succession trigger a single fit.
            autoFitTimer = setTimeout(() => {
                autoFitTimer = null;
                const seq = ++autoFitSeq;

                const maxAttempts = 120; // ~2s at 60fps
                const minPositionedRatio = 0.85;

                const countPositionedNodes = () => {
                    const nodes = graphData.nodes || [];
                    let total = 0;
                    let positioned = 0;
                    for (const n of nodes) {
                        if (!n || typeof n !== 'object') continue;
                        total += 1;
                        if (Number.isFinite(n.x) && Number.isFinite(n.y)) positioned += 1;
                    }
                    return { total, positioned };
                };

                const nodeFilter = (node) => {
                    if (!node || typeof node !== 'object') return false;
                    return Number.isFinite(node.x) && Number.isFinite(node.y);
                };

                const attemptFit = (attempt = 0) => {
                    if (seq !== autoFitSeq || !Graph) return;
                    if (!graphData || !Array.isArray(graphData.nodes) || graphData.nodes.length === 0) return;

                    const { total, positioned } = countPositionedNodes();
                    const ready = total > 0 && (positioned / total) >= minPositionedRatio;

                    // Wait for layout to produce stable coordinates for most nodes.
                    if (!ready && attempt < maxAttempts) {
                        requestAnimationFrame(() => attemptFit(attempt + 1));
                        return;
                    }

                    // Compute bounding box using force-graph's own bbox helper if available.
                    let bbox = null;
                    try {
                        if (typeof Graph.getGraphBbox === 'function') {
                            bbox = Graph.getGraphBbox(nodeFilter);
                        }
                    } catch (_) {
                        bbox = null;
                    }

                    if (!bbox || !bbox.x || !bbox.y) {
                        // Fallback: best-effort fit with whatever is currently positioned.
                        if (attempt < maxAttempts) {
                            requestAnimationFrame(() => attemptFit(attempt + 1));
                        }
                        return;
                    }

                    const minX = bbox.x[0], maxX = bbox.x[1];
                    const minY = bbox.y[0], maxY = bbox.y[1];
                    const spanX = maxX - minX;
                    const spanY = maxY - minY;

                    if (!Number.isFinite(spanX) || !Number.isFinite(spanY) || spanX <= 0 || spanY <= 0) return;

                    const cx = (minX + maxX) / 2;
                    const cy = (minY + maxY) / 2;

                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const pad = Math.max(0, padding);

                    const targetZoom = Math.max(
                        1e-12,
                        Math.min(1e12, (w - 2 * pad) / spanX, (h - 2 * pad) / spanY)
                    );

                    // Center and zoom to fit all loaded nodes.
                    Graph.centerAt(cx, cy, duration);
                    Graph.zoom(targetZoom, duration);
                };

                requestAnimationFrame(() => attemptFit(0));
            }, debounceMs);
        }

        function normalizeGraphData(data, { assumeBase = false } = {}) {
            const nodesIn = (data && Array.isArray(data.nodes)) ? data.nodes : [];
            const linksIn = (data && Array.isArray(data.links)) ? data.links : [];

            const nodes = [];
            const byId = new Map();
            const sanitizeNode = (n) => {
                if (n == null) return null;
                // Already an object with id
                if (typeof n === 'object') {
                    const id = n.id != null ? String(n.id) : (n.id === 0 ? '0' : null);
                    const safeId = id ?? (n && n !== Object(n) ? String(n) : null);
                    if (!safeId) return null;
                    return {
                        neighbors: [],
                        val: Number.isFinite(n.val) ? n.val : Math.max(2, 2 + Math.sqrt(n.degree || 0)),
                        isBase: assumeBase ? true : !!n.isBase,
                        _dynamic: n._dynamic ?? !assumeBase,
                        ...n,
                        id: safeId,
                        label: n.label || safeId,
                    };
                }

                // Primitive -> coerce to node object
                const id = String(n);
                if (!id) return null;
                return {
                    id,
                    label: id,
                    val: 1,
                    neighbors: [],
                    _dynamic: true,
                    isBase: assumeBase,
                };
            };

            const badNodes = [];

            const addNode = (n) => {
                const node = sanitizeNode(n);
                if (!node) {
                    badNodes.push(n);
                    return;
                }
                if (byId.has(node.id)) return;
                byId.set(node.id, node);
                nodes.push(node);
            };

            nodesIn.forEach(addNode);

            const links = [];
            linksIn.forEach(l => {
                if (!l || typeof l !== 'object') return;

                const s = typeof l.source === 'object' ? l.source?.id : l.source;
                const t = typeof l.target === 'object' ? l.target?.id : l.target;
                if (s == null || t == null) return;

                const sid = String(s);
                const tid = String(t);

                // Ensure endpoints exist as node objects (prevents implicit string nodes in force-graph)
                if (!byId.has(sid)) addNode(sid);
                if (!byId.has(tid)) addNode(tid);

                const isBase = assumeBase ? true : !!l.isBase;
                const isDynamic = assumeBase ? false : (l._dynamic ?? false);

                links.push({
                    ...l,
                    source: sid,
                    target: tid,
                    isBase,
                    _dynamic: isDynamic,
                });
            });

            if (badNodes.length) {
                console.warn(`[normalizeGraphData] Dropped ${badNodes.length} invalid node(s)`, badNodes.slice(0, 10));
            }
            return { nodes, links };
        }

        function resetGraphToBase() {
            if (!Graph || !graphData || !Array.isArray(graphData.nodes) || !Array.isArray(graphData.links)) return;

            const baseNodes = graphData.nodes.filter(n => n && n.isBase);
            const baseNodeIds = new Set(baseNodes.map(n => n.id));

            const baseLinks = graphData.links.filter(l => {
                if (!l || !l.isBase) return false;
                const s = typeof l.source === 'object' ? l.source.id : l.source;
                const t = typeof l.target === 'object' ? l.target.id : l.target;
                return baseNodeIds.has(s) && baseNodeIds.has(t);
            });

            graphData = { nodes: baseNodes, links: baseLinks };
            nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

            graphData.nodes.forEach(n => { n.neighbors = []; });
            graphData.links.forEach(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                const src = nodesById[s];
                const tgt = nodesById[t];
                if (src && tgt) {
                    src.neighbors.push(tgt);
                    tgt.neighbors.push(src);
                }
            });

            const normalized = normalizeGraphData(graphData);
            graphData = normalized;
            nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

            graphData.nodes.forEach(n => { n.neighbors = []; });
            graphData.links.forEach(link => {
                const src = nodesById[link.source];
                const tgt = nodesById[link.target];
                if (src && tgt) {
                    src.neighbors.push(tgt);
                    tgt.neighbors.push(src);
                }
            });

            setGraphData(graphData, 'resetGraphToBase');
            Graph.nodeCanvasObject(Graph.nodeCanvasObject());
        }

        let citationInteractionsInstalled = false;
        let activeCitationEl = null;
        let activeCitation = null;
        let activePinned = false;
        let activeExpanded = false;
        let hideTipTimer = null;

        function setupCitationHover() {
            // Backwards-compatible name; this now installs hover+click behavior.
            const tooltip = document.getElementById('citation-tooltip');
            const graphContainer = document.getElementById('graph-container');
            if (!tooltip || !graphContainer) return;

            const getCanvasRect = () => {
                const canvas = graphContainer.querySelector('canvas');
                return canvas ? canvas.getBoundingClientRect() : graphContainer.getBoundingClientRect();
            };

            function getCitationFromEl(el) {
                const citeKey = el?.dataset?.cite;
                if (citeKey && citationStore.has(citeKey)) return citationStore.get(citeKey);
                const idx = parseInt(el?.dataset?.index, 10);
                if (!Number.isFinite(idx)) return null;
                return citationData.find(cit => cit && cit.index === idx) || null;
            }

            function getNodeScreenPosition(nodeId) {
                const node = nodesById[nodeId];
                if (!node || !Graph) return null;
                const coords = Graph.graph2ScreenCoords(node.x, node.y);
                if (!coords) return null;
                const rect = getCanvasRect();
                return { x: rect.left + coords.x, y: rect.top + coords.y };
            }

            const truncate = (s, n) => {
                const str = String(s || '');
                if (str.length <= n) return str;
                return str.slice(0, Math.max(0, n - 1)).trimEnd() + '…';
            };

            function renderTooltip(c) {
                if (!c) return;

                const author = c.author || c.author_source || '';
                const work = c.work || c.title || '';
                const title = c.title || '';
                const tradition = c.tradition || '';

                const metaRows = [];
                if (author) metaRows.push(['Author', author]);
                if (work) metaRows.push(['Work', work]);
                if (title && work && title !== work) metaRows.push(['Title', title]);
                if (tradition) metaRows.push(['Tradition', tradition]);

                const snippetRaw = activeExpanded
                    ? (c.full_content || c.preview || '')
                    : (c.preview || c.full_content || '');
                const snippet = activeExpanded ? snippetRaw : truncate(snippetRaw, 260);

                const metaHtml = metaRows
                    .map(([k, v]) => `
                        <div class="citation-tooltip-k">${escapeHtml(k)}</div>
                        <div class="citation-tooltip-v">${escapeHtml(v)}</div>
                    `)
                    .join('');

                tooltip.classList.toggle('expanded', !!activeExpanded);
                tooltip.innerHTML = `
                    <div class="citation-tooltip-header">Citation &#91;${escapeHtml(String(c.index ?? ''))}&#93;</div>
                    ${metaRows.length ? `<div class="citation-tooltip-meta">${metaHtml}</div>` : ''}
                    <div class="citation-tooltip-snippet">${formatText(snippet || 'Source')}</div>
                    <div class="citation-tooltip-hint" data-mode="${activeExpanded ? 'collapse' : 'expand'}">Click this box to ${activeExpanded ? 'collapse' : 'expand'}.</div>
                `;
            }

            function positionTooltipAt(targetPos) {
                tooltip.style.display = 'block';
                const tipRect = tooltip.getBoundingClientRect();

                // Offset to the right of the anchor and slightly above center
                const offsetX = 14;
                const offsetY = -tipRect.height * 0.25;

                let posX = (targetPos?.x ?? 0) + offsetX;
                let posY = (targetPos?.y ?? 0) + offsetY;

                // Clamp inside viewport with 10px padding
                posX = Math.min(window.innerWidth - tipRect.width - 10, Math.max(10, posX));
                posY = Math.min(window.innerHeight - tipRect.height - 10, Math.max(10, posY));

                tooltip.style.left = `${posX}px`;
                tooltip.style.top = `${posY}px`;
            }

            function showTooltipAt(c, targetPos) {
                renderTooltip(c);
                positionTooltipAt(targetPos);
            }

            function hideTooltip({ clearHighlight = false } = {}) {
                citationHoverSeq += 1; // cancel in-flight tracking
                tooltip.style.display = 'none';
                tooltip.classList.remove('expanded');
                activeExpanded = false;
                if (activeCitationEl) activeCitationEl.setAttribute('aria-expanded', 'false');
                activeCitationEl = null;
                activeCitation = null;
                activePinned = false;
                if (clearHighlight) {
                    highlightNodes.clear();
                    if (Graph) Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                }
            }

            function trackTooltipToNode(seq, nodeIds, attempt = 0) {
                if (seq !== citationHoverSeq) return;
                if (!Array.isArray(nodeIds) || !nodeIds.length || attempt > 180) return;
                const nodePosition = nodeIds.map(getNodeScreenPosition).find(Boolean);
                if (nodePosition) positionTooltipAt(nodePosition);
                requestAnimationFrame(() => trackTooltipToNode(seq, nodeIds, attempt + 1));
            }

            function focusNodeView(seq, nodeIds, attempt = 0) {
                if (seq !== citationHoverSeq) return;
                if (!Graph || !Array.isArray(nodeIds) || !nodeIds.length || attempt > 180) return;
                const node = nodeIds
                    .map(id => nodesById[id])
                    .find(n => n && Number.isFinite(n.x) && Number.isFinite(n.y));
                if (!node) {
                    requestAnimationFrame(() => focusNodeView(seq, nodeIds, attempt + 1));
                    return;
                }
                Graph.centerAt(node.x, node.y, 600);
                Graph.zoom(4, 600);
            }

            function openHoverPreview(el) {
                if (activePinned) return; // keep pinned tooltip stable
                const c = getCitationFromEl(el);
                if (!c) return;
                activeCitationEl = el;
                activeCitation = c;
                activePinned = false;
                activeExpanded = false;

                // Anchor next to the citation in the chat log
                const r = el.getBoundingClientRect();
                const pos = { x: r.right, y: r.top + r.height * 0.5 };
                showTooltipAt(c, pos);
            }

            function openPinned(el, evt = null) {
                const c = getCitationFromEl(el);
                if (!c) return;

                // Toggle close if clicking the same citation again
                if (activePinned && activeCitationEl === el) {
                    hideTooltip({ clearHighlight: true });
                    return;
                }

                activeCitationEl = el;
                activeCitation = c;
                activePinned = true;
                activeExpanded = false;
                el.setAttribute('aria-expanded', 'true');
                el.setAttribute('aria-controls', 'citation-tooltip');

                const nodeIds = Array.isArray(c.node_ids) ? c.node_ids : [];

                // Start a new session (cancels any in-flight tracking)
                citationHoverSeq += 1;
                const seq = citationHoverSeq;

                const nodePosition = nodeIds.map(getNodeScreenPosition).find(Boolean);
                const r = el.getBoundingClientRect();
                const clickPos = evt && Number.isFinite(evt.clientX) && Number.isFinite(evt.clientY)
                    ? { x: evt.clientX, y: evt.clientY }
                    : null;
                const fallbackPos = clickPos || { x: r.right, y: r.top + r.height * 0.5 };
                const targetPos = nodePosition || fallbackPos;
                showTooltipAt(c, targetPos);

                // Keep the tooltip pinned to the node while the camera animates
                trackTooltipToNode(seq, nodeIds);

                if (nodeIds.length) {
                    highlightNodes.clear();
                    nodeIds.forEach(nid => highlightNodes.add(nid));
                    if (Graph) Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                    focusNodeView(seq, nodeIds);
                }
            }

            function clearHideTimer() {
                if (hideTipTimer) {
                    clearTimeout(hideTipTimer);
                    hideTipTimer = null;
                }
            }

            function scheduleHideIfNotPinned() {
                clearHideTimer();
                if (activePinned) return;
                hideTipTimer = setTimeout(() => {
                    // Only hide if the pointer isn't over the tooltip
                    if (!tooltip.matches(':hover')) {
                        hideTooltip({ clearHighlight: false });
                    }
                }, 120);
            }

            if (!citationInteractionsInstalled) {
                citationInteractionsInstalled = true;

                // Click to pin tooltip to source node and move camera.
                document.addEventListener('click', e => {
                    const el = e.target?.closest?.('.citation-ref');
                    if (!el) return;
                    e.stopPropagation();
                    openPinned(el, e);
                });

                // Click tooltip to expand/collapse snippet.
                tooltip.addEventListener('click', e => {
                    e.stopPropagation();
                    if (!activeCitation) return;
                    activeExpanded = !activeExpanded;
                    renderTooltip(activeCitation);

                    // Reposition after size change
                    const nodeIds = Array.isArray(activeCitation.node_ids) ? activeCitation.node_ids : [];
                    const nodePosition = nodeIds.map(getNodeScreenPosition).find(Boolean);
                    if (nodePosition) {
                        positionTooltipAt(nodePosition);
                    } else if (activeCitationEl) {
                        const r = activeCitationEl.getBoundingClientRect();
                        positionTooltipAt({ x: r.right, y: r.top + r.height * 0.5 });
                    }
                });

                tooltip.addEventListener('mouseenter', () => clearHideTimer());
                tooltip.addEventListener('mouseleave', () => scheduleHideIfNotPinned());

                // Dismiss pinned tooltip on outside click / Escape.
                document.addEventListener('click', e => {
                    const insideTooltip = e.target?.closest?.('#citation-tooltip');
                    const onCitation = e.target?.closest?.('.citation-ref');
                    if (insideTooltip || onCitation) return;
                    if (activePinned) hideTooltip({ clearHighlight: true });
                });

                window.addEventListener('keydown', e => {
                    if (e.key === 'Escape' && activePinned) {
                        hideTooltip({ clearHighlight: true });
                    }
                });
            }
        }

        function initGraph() {
            const container = document.getElementById('graph-container');

            Graph = ForceGraph()(container)
                .backgroundColor('#000000')
                .width(window.innerWidth)
                .height(window.innerHeight)
                .nodeCanvasObject((node, ctx, globalScale) => {
                    ctx.globalAlpha = 1.0;
                    ctx.imageSmoothingEnabled = false;
                    const pixelSize = 2;
                    const snap = v => Math.round(v / pixelSize) * pixelSize;
                    const x = snap(node.x);
                    const y = snap(node.y);

                    // Radius based on value
                    const rRaw = Math.max(8, 8 + Math.sqrt(node.val || 0));
                    const r = Math.round(rRaw / pixelSize) * pixelSize;

                    const label = node.label || node.id;
                    const baseFont = Math.max(9, Math.min(18, r * 2.5));
                    const fontSize = baseFont / globalScale;
                    ctx.font = `${fontSize}px "VT323", monospace`;

                    const isActive = highlightNodes.has(node.id) || traversalNodes.has(node.id) || gestureHighlightNodes.has(node.id);
                    const strokeColor = isActive ? '#00ff8a' : '#ffffff';

                    // Octagon Logic: intersection of box and rotated box (sum of abs)
                    // box: max(|dx|, |dy|) <= r
                    // diamond: |dx| + |dy| <= r * 1.4
                    const limit = r * 1.4;
                    const innerR = Math.max(0, r - pixelSize);
                    const innerLimit = innerR * 1.4;

                    // Solid fill to ensure opacity (prevents sub-pixel translucency artifacts)
                    ctx.fillStyle = '#000000';
                    if (innerR > 0) {
                        const A = innerR;
                        const B = Math.max(0, innerLimit - innerR);
                        ctx.beginPath();
                        ctx.moveTo(x + A, y + B);
                        ctx.lineTo(x + B, y + A);
                        ctx.lineTo(x - B, y + A);
                        ctx.lineTo(x - A, y + B);
                        ctx.lineTo(x - A, y - B);
                        ctx.lineTo(x - B, y - A);
                        ctx.lineTo(x + B, y - A);
                        ctx.lineTo(x + A, y - B);
                        ctx.closePath();
                        ctx.fill();
                    }

                    for (let ix = -r; ix <= r; ix += pixelSize) {
                        for (let iy = -r; iy <= r; iy += pixelSize) {
                            const adx = Math.abs(ix);
                            const ady = Math.abs(iy);
                            const sum = adx + ady;

                            if (sum <= limit) {
                                // It's inside the outer octagon
                                if (adx <= innerR && ady <= innerR && sum <= innerLimit) {
                                    // Inside inner octagon -> Fill Black
                                    ctx.fillStyle = '#000';
                                    ctx.fillRect(x + ix, y + iy, pixelSize, pixelSize);
                                } else {
                                    // Border -> Fill White/Green
                                    ctx.fillStyle = strokeColor;
                                    ctx.fillRect(x + ix, y + iy, pixelSize, pixelSize);
                                }
                            }
                        }
                    }

                    if (globalScale > 0.8 || isActive || node.val > 10) {
                        ctx.fillStyle = isActive ? '#00ff8a' : '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, x, y);
                    }
                })
                .linkCanvasObject((link, ctx, globalScale) => {
                    ctx.imageSmoothingEnabled = false;
                    ctx.lineCap = 'square';
                    ctx.lineJoin = 'miter';
                    const snap = v => Math.round(v);
                    const start = link.source;
                    const end = link.target;
                    if (typeof start !== 'object' || typeof end !== 'object') return;

                    const curvature = 0.2;
                    const sx = snap(start.x);
                    const sy = snap(start.y);
                    const ex = snap(end.x);
                    const ey = snap(end.y);
                    const dx = ex - sx;
                    const dy = ey - sy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist === 0) return;
                    const midX = (sx + ex) / 2;
                    const midY = (sy + ey) / 2;
                    const nx = -dy / dist;
                    const ny = dx / dist;
                    const cpX = snap(midX + nx * dist * curvature);
                    const cpY = snap(midY + ny * dist * curvature);

                    const isTraversal = traversalLinks.has(`${start.id}-${end.id}`) || traversalLinks.has(`${end.id}-${start.id}`);
                    const isHighlight = (highlightNodes.has(start.id) && highlightNodes.has(end.id)) ||
                        (gestureHighlightNodes.has(start.id) && gestureHighlightNodes.has(end.id));
                    const isActive = isTraversal || isHighlight;

                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo(cpX, cpY, ex, ey);
                    ctx.strokeStyle = isActive ? '#00ff8a' : 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = (isActive ? 2 : 0.5) / globalScale;
                    ctx.stroke();

                    const label = link.label || link.type;
                    if (label && (globalScale > 1.2 || isActive)) {
                        const t = 0.5;
                        const bx = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * cpX + t * t * ex;
                        const by = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * cpY + t * t * ey;
                        const angle = Math.atan2(dy, dx);

                        ctx.save();
                        ctx.translate(bx, by);
                        ctx.rotate(angle);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = isActive ? '#00ff8a' : '#ffffff';
                        // Scale label with graph (fixed graph units) so it grows when zooming in
                        const fontSize = 3;
                        ctx.font = `${fontSize}px "VT323", monospace`;
                        ctx.fillText(label, 0, -3);
                        ctx.restore();
                    }
                })
                .onNodeClick(node => {
                    highlightNodes.clear();
                    if (node) {
                        highlightNodes.add(node.id);
                        if (Array.isArray(node.neighbors)) {
                            node.neighbors.forEach(n => highlightNodes.add(n.id));
                        }
                    }
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                })
                .onBackgroundClick(() => {
                    highlightNodes.clear();
                    Graph.nodeCanvasObject(Graph.nodeCanvasObject());
                });

            Graph.d3Force('charge').strength(-120);
            Graph.d3Force('link').distance(120);
            Graph.onEngineTick(() => {
                checkForceGraphInternalData('engineTick');
            });

            // Expose for manual debugging.
            window.forceGraph = Graph;
            startGraphInvariantWatchdog();

            // Capture the initial viewport/chatbox placement once (used by Reset).
            captureInitialUiStateIfNeeded();
        }

        async function loadGraph() {
            try {
                const res = await fetch(`${API_BASE}/api/graph?limit=5000`);
                if (!res.ok) throw new Error('Failed to load graph');
                const rawData = await res.json();

                const allNodes = new Map();
                rawData.nodes.forEach(n => {
                    allNodes.set(n.id, n);
                    allKnownNodes.set(n.id, n);
                });

                const adj = new Map();
                rawData.nodes.forEach(n => adj.set(n.id, []));
                const validLinks = rawData.links.filter(l => allNodes.has(l.source) && allNodes.has(l.target));

                validLinks.forEach(link => {
                    adj.get(link.source).push(link.target);
                    adj.get(link.target).push(link.source);
                });

                const visited = new Set();
                const components = [];

                for (const nodeId of allNodes.keys()) {
                    if (!visited.has(nodeId)) {
                        const component = [];
                        const queue = [nodeId];
                        visited.add(nodeId);

                        while (queue.length > 0) {
                            const current = queue.shift();
                            component.push(current);
                            const neighbors = adj.get(current) || [];
                            neighbors.forEach(next => {
                                if (!visited.has(next)) {
                                    visited.add(next);
                                    queue.push(next);
                                }
                            });
                        }
                        components.push(component);
                    }
                }

                if (components.length === 0) return;

                const largestComponentIds = new Set(components.reduce((a, b) => (a.length > b.length ? a : b)));
                const mainNodes = rawData.nodes.filter(n => largestComponentIds.has(n.id));
                const mainLinks = validLinks.filter(l => largestComponentIds.has(l.source) && largestComponentIds.has(l.target));

                const nodeDegrees = new Map();
                mainNodes.forEach(n => nodeDegrees.set(n.id, 0));
                mainLinks.forEach(l => {
                    nodeDegrees.set(l.source, (nodeDegrees.get(l.source) || 0) + 1);
                    nodeDegrees.set(l.target, (nodeDegrees.get(l.target) || 0) + 1);
                });

                const nodesByCommunity = {};
                mainNodes.forEach(n => {
                    const comm = n.community || 'unknown';
                    if (!nodesByCommunity[comm]) nodesByCommunity[comm] = [];
                    n.val = nodeDegrees.get(n.id);
                    nodesByCommunity[comm].push(n);
                });

                const finalNodes = [];
                Object.values(nodesByCommunity).forEach(commNodes => {
                    commNodes.sort((a, b) => b.val - a.val);
                    if (commNodes[0]) finalNodes.push(commNodes[0]);
                });

                const finalNodeIds = new Set(finalNodes.map(n => n.id));
                const finalLinks = mainLinks.filter(l => finalNodeIds.has(l.source) && finalNodeIds.has(l.target));

                const linkedNodeIds = new Set();
                finalLinks.forEach(link => {
                    linkedNodeIds.add(link.source);
                    linkedNodeIds.add(link.target);
                });
                const connectedFinalNodes = finalNodes.filter(node => linkedNodeIds.has(node.id));
                const connectedNodeIds = new Set(connectedFinalNodes.map(n => n.id));
                const connectedFinalLinks = finalLinks.filter(link => connectedNodeIds.has(link.source) && connectedNodeIds.has(link.target));

                graphData = normalizeGraphData({ nodes: connectedFinalNodes, links: connectedFinalLinks }, { assumeBase: true });

                nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));

                graphData.nodes.forEach(n => { n.neighbors = []; });
                graphData.links.forEach(link => {
                    const src = nodesById[link.source];
                    const tgt = nodesById[link.target];
                    if (src && tgt) {
                        src.neighbors.push(tgt);
                        tgt.neighbors.push(src);
                    }
                });

                setGraphData(graphData, 'loadGraph');
                document.getElementById('loading').style.display = 'none';
                bootSequence();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-text').innerText = 'Error: ' + err.message;
            }
        }

        function applyChatScaleFromSize(width, height) {
            if (!chatbox) return;
            if (!Number.isFinite(width) || !Number.isFinite(height)) return;
            const baseW = 460;
            const baseH = 520;
            const area = Math.max(1, width * height);
            const baseArea = baseW * baseH;
            const next = clamp(Math.sqrt(area / baseArea), 0.9, 1.6);
            chatbox.style.setProperty('--chat-scale', String(next));
        }

        function updateChatboxRect() {
            chatboxRect = chatbox.getBoundingClientRect();
            if (chatboxRect) applyChatScaleFromSize(chatboxRect.width, chatboxRect.height);
        }

        function setChatboxCollapsed(collapsed, { fromRestore = false } = {}) {
            if (!chatbox) return;
            const next = !!collapsed;
            chatboxCollapsed = next;

            if (next) {
                if (!fromRestore) lastExpandedHeight = chatbox.offsetHeight;
                chatbox.classList.add('collapsed');
                // CSS handles min-height:0 and height:auto; clear any inline height
                // so the chatbox shrinks to just the header.
                chatbox.style.height = '';
                // Inline hide to override any previous prompt-row inline display.
                if (promptRow) promptRow.style.display = 'none';
            } else {
                chatbox.classList.remove('collapsed');
                const restoreH = lastExpandedHeight || initialUiState.chatboxHeight;
                if (restoreH) chatbox.style.height = `${restoreH}px`;
                // Restore prompt visibility only if we're not in waiting/disabled state.
                if (promptRow && !promptInput.disabled) promptRow.style.display = 'flex';
            }

            updateChatboxRect();
        }

        function saveChatToFile() {
            const lines = Array.from(chatLog.querySelectorAll('.chat-line'));
            const out = lines.map(line => {
                const role = line.classList.contains('user') ? 'USER'
                    : line.classList.contains('system') ? 'SYSTEM'
                    : 'AI';
                const textEl = line.querySelector('.line-text');
                const text = textEl ? (textEl.innerText || '').trimEnd() : '';
                return `${role}: ${text}`;
            }).join('\n\n');

            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            const name = `philosiphai-chat-${stamp}.txt`;
            const blob = new Blob([out || ''], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 250);
        }

        function enableDragging() {
            if (!dragBtn || !chatbox) return;

            let pointerId = null;
            let offsetX = 0;
            let offsetY = 0;

            const onPointerMove = e => {
                if (pointerId === null || e.pointerId !== pointerId) return;
                const nextLeft = clamp(e.clientX - offsetX, 10, window.innerWidth - chatbox.offsetWidth - 10);
                const nextTop = clamp(e.clientY - offsetY, 10, window.innerHeight - chatbox.offsetHeight - 10);
                chatbox.style.left = `${nextLeft}px`;
                chatbox.style.top = `${nextTop}px`;
                updateChatboxRect();
            };

            const endDrag = e => {
                if (pointerId === null || (e && e.pointerId !== pointerId)) return;
                try { dragBtn.releasePointerCapture(pointerId); } catch (_) {}
                pointerId = null;
                chatbox.classList.remove('dragging');
                updateChatboxRect();
            };

            // Prevent click-to-focus from stealing focus when interacting with drag handle.
            dragBtn.addEventListener('click', (e) => e.stopPropagation());

            dragBtn.addEventListener('pointerdown', e => {
                // Disable drag during two-hand gesture mode to prevent accidental interaction
                if (gestureTwoHandMode) return;

                e.stopPropagation();
                e.preventDefault();

                pointerId = e.pointerId;
                const rect = chatbox.getBoundingClientRect();
                offsetX = e.clientX - rect.left; // relative to box
                offsetY = e.clientY - rect.top;

                chatbox.classList.add('dragging');
                dragBtn.setPointerCapture(pointerId);
                if (Graph && typeof Graph.d3ReheatSimulation === 'function') Graph.d3ReheatSimulation();
            });

            dragBtn.addEventListener('pointermove', onPointerMove);
            dragBtn.addEventListener('pointerup', endDrag);
            dragBtn.addEventListener('pointercancel', endDrag);
            dragBtn.addEventListener('lostpointercapture', endDrag);

            new ResizeObserver(() => updateChatboxRect()).observe(chatbox);
        }

        function enableResizing() {
            if (!resizeHandle || !chatbox) return;

            let pointerId = null;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;
            let startWidth = 0;
            let startHeight = 0;

            const MIN_W = 280;
            const MIN_H = 150;

            const onMove = (e) => {
                if (pointerId === null || e.pointerId !== pointerId) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                // Bottom-right resize: width/height change, left/top stay fixed.
                const maxW = Math.max(MIN_W, window.innerWidth - startLeft - 10);
                const maxH = Math.max(MIN_H, window.innerHeight - startTop - 10);

                const nextW = clamp(startWidth + dx, MIN_W, maxW);
                const nextH = clamp(startHeight + dy, MIN_H, maxH);

                chatbox.style.width = `${nextW}px`;
                chatbox.style.height = `${nextH}px`;
                updateChatboxRect();
            };

            const end = (e) => {
                if (pointerId === null || (e && e.pointerId !== pointerId)) return;
                try { resizeHandle.releasePointerCapture(pointerId); } catch (_) {}
                pointerId = null;
                updateChatboxRect();
            };

            resizeHandle.addEventListener('pointerdown', (e) => {
                // Disable resize during two-hand gesture mode
                if (gestureTwoHandMode) return;

                e.stopPropagation();
                e.preventDefault();
                if (chatbox.classList.contains('collapsed')) return;

                pointerId = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = chatbox.offsetLeft;
                startTop = chatbox.offsetTop;
                startWidth = chatbox.offsetWidth;
                startHeight = chatbox.offsetHeight;

                resizeHandle.setPointerCapture(pointerId);
                if (Graph && typeof Graph.d3ReheatSimulation === 'function') Graph.d3ReheatSimulation();
            });

            resizeHandle.addEventListener('pointermove', onMove);
            resizeHandle.addEventListener('pointerup', end);
            resizeHandle.addEventListener('pointercancel', end);
        }

        promptInput.addEventListener('keydown', handlePromptSubmit);
        // Sync display on input interactions
        ['input', 'keydown', 'keyup', 'click', 'select', 'focus', 'blur', 'scroll'].forEach(evt => {
            promptInput.addEventListener(evt, () => requestAnimationFrame(updatePromptDisplay));
        });

        window.addEventListener('resize', () => {
            if (!chatboxRect) return;

            // Clamp size to viewport
            const maxW = Math.max(280, window.innerWidth - 20);
            const maxH = Math.max(150, window.innerHeight - 20);
            if (chatbox.offsetWidth > maxW) chatbox.style.width = `${maxW}px`;
            if (chatbox.offsetHeight > maxH) chatbox.style.height = `${maxH}px`;

            // Clamp position to viewport
            chatbox.style.left = `${clamp(chatbox.offsetLeft, 10, window.innerWidth - chatbox.offsetWidth - 10)}px`;
            chatbox.style.top = `${clamp(chatbox.offsetTop, 10, window.innerHeight - chatbox.offsetHeight - 10)}px`;

            if (Graph) Graph.width(window.innerWidth).height(window.innerHeight);
            updateChatboxRect();
        });

        chatbox.addEventListener('click', () => {
            if (chatboxCollapsed) return;
            if (promptInput.disabled) return;
            focusPrompt();
        });
        window.addEventListener('keydown', e => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (chatboxCollapsed) return;
            if (promptInput.disabled) return;
            if (document.activeElement !== promptInput) focusPrompt();
        });

        enableDragging();
        enableResizing();
        try {
            updateChatboxRect();
            initGraph();
            loadGraph();
        } catch (err) {
            console.error(err);
            document.getElementById('loading-text').innerText = 'System Error: ' + err.message;
        }
    })();
    </script>
</body>
</html>
