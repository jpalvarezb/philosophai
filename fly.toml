app = "philo-butlerian"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "8000"
  PHILOSOPH_ENV = "production"
  PHILOSOPH_DB = "/data/philosoph.duckdb"
  CORS_ORIGINS = "https://butlerian.xyz,https://www.butlerian.xyz"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "philo_data"
  destination = "/data"
